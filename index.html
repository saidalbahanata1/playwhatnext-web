    // clear the 3 lowest orbs + extra moves
    const all=[];
    for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++) if(this.g[r][c]) all.push({r,c,v:this.g[r][c]});
    all.sort((x,y)=>x.v-y.v);
    all.slice(0,3).forEach(o=>this.g[o.r][o.c]=0);
    if(this.P.moves>0) this.movesLeft += 6;
    this.updateHud();
  }
  progress(){ return Math.log2(this.best) / Math.log2(this.P.target); }
  update(dt){}
  orbColor(v){ return this.t.tile[Math.floor(Math.log2(v)) % this.t.tile.length]; }
  draw(){
    bgDark(this.t);
    ctx.fillStyle="rgba(255,255,255,.04)";
    rr(this.x0-10, this.y0-10, this.N*this.cell+20, this.N*this.cell+20, 16); ctx.fill();
    for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){
      const x=this.x0+c*this.cell, y=this.y0+r*this.cell;
      ctx.fillStyle="rgba(255,255,255,.05)";
      rr(x+4,y+4,this.cell-8,this.cell-8,12); ctx.fill();
      const v=this.g[r][c];
      if(!v) continue;
      if(this.drag && this.drag.from.r===r && this.drag.from.c===c) continue; // drawn as ghost
      this.drawOrb(x+this.cell/2, y+this.cell/2, v);
    }
    if(this.drag){
      const v=this.g[this.drag.from.r][this.drag.from.c];
      ctx.globalAlpha=.85; this.drawOrb(this.drag.x, this.drag.y, v); ctx.globalAlpha=1;
    }
    ctx.fillStyle="rgba(0,0,0,.35)"; rr(50, 40, W-100, 56, 12); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 16px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
    ctx.fillText(`Build an orb of ${this.P.target}`, W/2, 63);
    ctx.fillStyle="#9aa3bf"; ctx.font="12px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif";
    ctx.fillText(`drag onto a matching orb to merge · best: ${this.best}${this.P.moves>0?` · moves left: ${this.movesLeft}`:""}`, W/2, 84);
  }
  drawOrb(x,y,v){
    const rds = this.cell/2 - 10;
    // solid orb first, then a glossy highlight composited ON TOP —
    // a translucent stop inside the gradient let the dark board bleed
    // through and read as a gray dot (bug report #5)
    ctx.fillStyle=this.orbColor(v);
    ctx.beginPath(); ctx.arc(x,y,rds,0,6.283); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.38)";
    ctx.beginPath(); ctx.ellipse(x-rds*0.34, y-rds*0.40, rds*0.34, rds*0.22, -0.55, 0, 6.283); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.2)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,rds,0,6.283); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,rds-6,-2.3,-1.2); ctx.stroke();
    ctx.fillStyle="#10131c"; ctx.font=`bold ${v>=128?20:24}px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(v, x, y+1);
  }
}

/* =====================================================================
   ENGINE 6 — BUBBLE BLAST (aim & pop clusters of 3+)
   ===================================================================== */
class Bubble{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.cols=10; this.cw=W/this.cols; this.R=17; this.rowH=34; this.offY=70;
    this.descend=0; this.grid=[];
    for(let r=0;r<P.rows;r++) this.grid.push(this.newRow(r));
    this.shots=P.shots; this.cleared=0; this.shotsSince=0;
    this.cur=this.randC(); this.next=this.randC();
    this.sx=W/2; this.sy=H-70;
    this.aim=-Math.PI/2; this.aiming=false; this.ball=null;
    this.updateHud();
  }
  randC(){ return Math.floor(Math.random()*this.P.colors); }
  newRow(r){ const n=this.cols-(r%2); return new Array(n).fill(0).map(()=>this.randC()); }
  cellPos(r,c){ return {x:(c+0.5+(r%2?0.5:0))*this.cw, y:this.offY+this.descend+r*this.rowH}; }
  updateHud(){ this.h.setProgress(`${this.cleared}/${this.P.target} · ${this.h.freeplay ? "∞" : this.shots} shots`); }
  setAim(p){
    const dx=p.x-this.sx, dy=p.y-this.sy;
    this.aim=Math.atan2(Math.min(dy,-20), dx);
  }
  onDown(p){ this.aiming=true; this.setAim(p); }
  onMove(p){ if(this.aiming) this.setAim(p); }
  onUp(p){ if(this.aiming){ this.aiming=false; this.setAim(p); this.fire(); } }
  onKey(k){
    if(k==="ArrowLeft") this.aim=Math.max(-Math.PI+0.15, this.aim-0.08);
    if(k==="ArrowRight") this.aim=Math.min(-0.15, this.aim+0.08);
    if(k===" ") this.fire();
  }
  fire(){
    if(this.ball) return;
    if(this.shots<=0 && !this.h.freeplay) return;
    if(!this.h.freeplay) this.shots--;      // bonus play: unlimited shots
    this.updateHud();
    Sfx.play("tap");
    this.ball={x:this.sx, y:this.sy, vx:Math.cos(this.aim)*620, vy:Math.sin(this.aim)*620, c:this.cur};
    this.cur=this.next; this.next=this.randC();
  }
  occupied(){ const out=[]; for(let r=0;r<this.grid.length;r++)for(let c=0;c<this.grid[r].length;c++) if(this.grid[r][c]>=0) out.push([r,c]); return out; }
  neighbors(r,c){
    const res=[[r,c-1],[r,c+1]];
    const off = r%2 ? [0,1] : [-1,0];
    for(const dr of [-1,1]) for(const o of off) res.push([r+dr,c+o]);
    return res.filter(([rr,cc])=>rr>=0 && this.grid[rr] && cc>=0 && cc<this.grid[rr].length);
  }
  snapBall(){
    const b=this.ball; this.ball=null;
    let r=Math.max(0, Math.round((b.y-this.offY-this.descend)/this.rowH));
    while(this.grid.length<=r+1) this.grid.push(new Array(this.cols-(this.grid.length%2)).fill(-1));
    let best=null, bd=1e9;
    for(let rr=Math.max(0,r-1); rr<=r+1; rr++){
      for(let cc=0; cc<this.grid[rr].length; cc++){
        if(this.grid[rr][cc]>=0) continue;
        const p=this.cellPos(rr,cc), dd=(p.x-b.x)**2+(p.y-b.y)**2;
        if(dd<bd){ bd=dd; best=[rr,cc]; }
      }
    }
    if(!best){ this.checkEnd(); return; }
    const [sr,sc]=best;
    this.grid[sr][sc]=b.c;
    // flood-fill same color
    const key=(r,c)=>r+","+c, seen=new Set([key(sr,sc)]), stack=[[sr,sc]], match=[[sr,sc]];
    while(stack.length){
      const [r0,c0]=stack.pop();
      for(const [rr,cc] of this.neighbors(r0,c0)){
        if(seen.has(key(rr,cc)) || this.grid[rr][cc]!==b.c) continue;
        seen.add(key(rr,cc)); stack.push([rr,cc]); match.push([rr,cc]);
      }
    }
    if(match.length>=3){
      for(const [rr,cc] of match){
        const p=this.cellPos(rr,cc);
        FX.burst(p.x,p.y,this.t.tile[this.grid[rr][cc]],7,140);
        this.grid[rr][cc]=-1; this.cleared++;
      }
      Sfx.play("pop");
      // drop orphans not connected to the top row
      const con=new Set(), q=[];
      for(let c=0;c<this.grid[0].length;c++) if(this.grid[0][c]>=0){ con.add(key(0,c)); q.push([0,c]); }
      while(q.length){
        const [r0,c0]=q.pop();
        for(const [rr,cc] of this.neighbors(r0,c0)){
          if(this.grid[rr][cc]>=0 && !con.has(key(rr,cc))){ con.add(key(rr,cc)); q.push([rr,cc]); }
        }
      }
      let dropped=0;
      for(let rr=0;rr<this.grid.length;rr++)for(let cc=0;cc<this.grid[rr].length;cc++){
        if(this.grid[rr][cc]>=0 && !con.has(key(rr,cc))){
          const p=this.cellPos(rr,cc);
          FX.burst(p.x,p.y,this.t.tile[this.grid[rr][cc]],5,120);
          this.grid[rr][cc]=-1; this.cleared++; dropped++;
        }
      }
      if(dropped>=3){ FX.float(W/2, this.offY+this.descend+120, `+${dropped} DROP!`, "#ffcf5c"); Sfx.play("pass"); }
    } else Sfx.play("drop");
    this.updateHud();
    // descend pressure — always on during bonus play so the run ends naturally
    this.shotsSince++;
    const dEvery = this.h.freeplay ? 6 : this.P.descendEvery;
    if(dEvery && this.shotsSince % dEvery === 0){
      this.descend += this.rowH/2;
      FX.kick(6);
    }
    this.checkEnd();
  }
  lowestY(){
    let low=0;
    for(const [r,c] of this.occupied()) low=Math.max(low, this.cellPos(r,c).y);
    return low;
  }
  checkEnd(){
    if(this.cleared >= this.P.target){ this.h.win(); return; }
    // lose as soon as any bubble touches the danger line (edge, not center —
    // otherwise play continues while bubbles visibly sit on the line)
    if(this.lowestY() + this.R >= H-160){ this.h.fail(); return; }
    if(this.shots<=0 && !this.ball && !this.h.freeplay){ this.h.fail(); return; }
  }
  revive(){
    this.shots += 8;
    this.descend = Math.max(0, this.descend - this.rowH);
    while(this.lowestY() > H-190 && this.grid.length>2) this.grid.pop();
    this.updateHud();
  }
  progress(){ return this.cleared / this.P.target; }
  update(dt){
    if(!this.ball) return;
    const b=this.ball, steps=3, sdt=dt/steps;
    for(let i=0;i<steps && this.ball;i++){
      b.x += b.vx*sdt; b.y += b.vy*sdt;
      if(b.x < this.R){ b.x=this.R; b.vx*=-1; }
      if(b.x > W-this.R){ b.x=W-this.R; b.vx*=-1; }
      if(b.y < this.offY+this.descend){ this.snapBall(); break; }
      for(const [r,c] of this.occupied()){
        const p=this.cellPos(r,c);
        if((p.x-b.x)**2+(p.y-b.y)**2 < (this.R*1.8)**2){ this.snapBall(); break; }
      }
      if(this.ball && b.y > H+30){ this.ball=null; this.checkEnd(); }
    }
  }
  draw(){
    bgDark(this.t);
    // ceiling
    ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fillRect(0, this.offY+this.descend-26, W, 6);
    for(const [r,c] of this.occupied()){
      const p=this.cellPos(r,c), col=this.grid[r][c];
      // solid bubble + highlight on top (same gray-dot fix as Merge Roll)
      ctx.fillStyle=this.t.tile[col];
      ctx.beginPath(); ctx.arc(p.x,p.y,this.R-1,0,6.283); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(p.x-6,p.y-7,3,0,6.283); ctx.fill();
      if(S.cbSymbols){
        ctx.fillStyle="rgba(0,0,0,.45)"; ctx.font="bold 13px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(Match3.SYMBOLS[col], p.x, p.y+1);
      }
    }
    // danger line
    ctx.strokeStyle="rgba(255,107,107,.5)"; ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(0,H-160); ctx.lineTo(W,H-160); ctx.stroke(); ctx.setLineDash([]);
    // aim line
    if(this.aiming || !this.ball){
      ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.setLineDash([3,9]); ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(this.sx,this.sy);
      ctx.lineTo(this.sx+Math.cos(this.aim)*230, this.sy+Math.sin(this.aim)*230);
      ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
    }
    // flying ball
    if(this.ball){
      ctx.fillStyle=this.t.tile[this.ball.c];
      ctx.beginPath(); ctx.arc(this.ball.x,this.ball.y,this.R-1,0,6.283); ctx.fill();
    }
    // shooter — cannon
    ctx.fillStyle="rgba(255,255,255,.10)"; ctx.beginPath(); ctx.arc(this.sx,this.sy+8,30,Math.PI,0); ctx.fill();
    ctx.save(); ctx.translate(this.sx,this.sy); ctx.rotate(this.aim);
    ctx.fillStyle="#3d4463"; rr(6,-10,30,20,9); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)"; rr(9,-8,24,6,3); ctx.fill();
    ctx.restore();
    ctx.fillStyle="#2b3149"; ctx.beginPath(); ctx.arc(this.sx,this.sy,22,0,6.283); ctx.fill();
    ctx.fillStyle=this.t.tile[this.cur];
    ctx.beginPath(); ctx.arc(this.sx,this.sy,this.R,0,6.283); ctx.fill();
    if(S.cbSymbols){
      ctx.fillStyle="rgba(0,0,0,.45)"; ctx.font="bold 13px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(Match3.SYMBOLS[this.cur], this.sx, this.sy+1);
    }
    ctx.fillStyle=this.t.tile[this.next];
    ctx.beginPath(); ctx.arc(this.sx+52,this.sy+8,10,0,6.283); ctx.fill();
    ctx.fillStyle="#9aa3bf"; ctx.font="10px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
    ctx.fillText("next", this.sx+52, this.sy+30);
  }
}

/* =====================================================================
   ENGINE 7 — SKY HOPPER (steer & bounce upward)
   ===================================================================== */
class Hopper{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.grav=1500; this.bounceV=680; this.r=15;
    this.x=W/2; this.y=H-90; this.vy=-this.bounceV; this.vx=0; this.prevY=this.y;
    this.targetX=W/2; this.camY=0; this.time=0;
    this.plats=[{x:W/2, baseX:W/2, y:H-40, w:70, type:"n", broken:false, ph:0}];
    this._genY=H-40; this._genBreak=false; this._genX=W/2;
    this.genTo(-(P.target+500));
    this.updateHud();
  }
  genTo(limit){
    // lazily generate platform bands down to world-y `limit` (also feeds bonus play)
    const P=this.P;
    while(this._genY > limit){
      this._genY -= P.gap*(0.75+Math.random()*0.5);
      const yy=this._genY;
      let type="n";
      if(!this._genBreak && Math.random()<P.breakFrac) type="b";
      else if(Math.random()<P.moveFrac) type="m";
      this._genBreak = type==="b";
      // keep each platform horizontally reachable from the previous SOLID rung
      const prevX = this._genX;
      const x=Math.max(40, Math.min(W-40, prevX + (Math.random()-0.5)*300));
      this.plats.push({x, baseX:x, y:yy, w:P.pw, type, broken:false, ph:Math.random()*6.28});
      let anchorX = x;
      // density: a second platform in the band keeps ascent flowing (Doodle Jump feel);
      // a breakable band ALWAYS gets a solid companion reachable from the previous rung
      if(type==="b" || Math.random() < lerp(0.55, 0.2, P.d)){
        let x2 = Math.max(40, Math.min(W-40, prevX + (Math.random()-0.5)*260));
        if(Math.abs(x2-x) < 90) x2 = Math.max(40, Math.min(W-40, x + (x2>=x ? 90 : -90)));
        this.plats.push({x:x2, baseX:x2, y:yy+(Math.random()-0.5)*24, w:P.pw, type:"n", broken:false, ph:0});
        if(type==="b") anchorX = x2;
      }
      this._genX = anchorX;
    }
  }
  height(){ return Math.max(0, Math.round((H-90) - this.y)); }
  updateHud(){ this.h.setProgress(`${this.height()} / ${this.P.target} m`); }
  onDown(p){ this.targetX=p.x; }
  onMove(p){ this.targetX=p.x; }
  onKey(k){ if(k==="ArrowLeft"||k==="a") this.targetX=Math.max(20,this.x-90); if(k==="ArrowRight"||k==="d") this.targetX=Math.min(W-20,this.x+90); }
  revive(){
    // rescue: teleport onto a solid platform INSIDE the camera view —
    // re-bouncing below the screen just failed again instantly
    let best=null, bd=1e9;
    for(const p of this.plats){
      if(p.broken || p.type==="b") continue;
      const sy = p.y - this.camY;
      if(sy < 90 || sy > H-60) continue;
      const dd = Math.abs((p.y - this.camY) - H*0.6);
      if(dd < bd){ bd = dd; best = p; }
    }
    if(!best){
      best = {x:W/2, baseX:W/2, y:this.camY + H*0.65, w:96, type:"n", broken:false, ph:0};
      this.plats.push(best);
    }
    this.x = best.x; this.targetX = best.x; this.vx = 0;
    this.y = best.y - 30; this.prevY = this.y;
    this.vy = -this.bounceV;
  }
  progress(){ return this.height() / this.P.target; }
  update(dt){
    this.time += dt;
    const want = Math.max(-430, Math.min(430, (this.targetX-this.x)*10));
    this.vx += (want - this.vx)*Math.min(1,dt*12);
    this.x += this.vx*dt;
    if(this.x<-this.r) this.x=W+this.r;
    if(this.x>W+this.r) this.x=-this.r;
    this.prevY=this.y;
    this.vy += this.grav*dt; this.y += this.vy*dt;
    for(const p of this.plats){
      if(p.broken) continue;
      if(p.type==="m") p.x = Math.max(40, Math.min(W-40, p.baseX + Math.sin(this.time*1.6+p.ph)*46));
      if(this.vy>0 && this.prevY+this.r <= p.y+4 && this.y+this.r >= p.y && Math.abs(this.x-p.x) < p.w/2+this.r*0.9){
        if(p.type==="b"){ p.broken=true; Sfx.play("drop"); FX.burst(p.x,p.y,"#a07b52",8,120); }
        else{
          this.vy=-this.bounceV; Sfx.play("tap");
          FX.burst(this.x, p.y, "#ffffff", 4, 70);
        }
      }
    }
    this.camY = Math.min(this.camY, this.y-240);
    this.genTo(this.y - 900);   // keep content coming (also feeds bonus play)
    this.updateHud();
    if(this.height() >= this.P.target && !this.h.freeplay){ this.h.win(); return; }
    if(this.y - this.camY > H+40){ this.h.fail(); return; }
  }
  draw(){
    bgSky(this.t);
    for(const p of this.plats){
      const sy=p.y-this.camY;
      if(sy<-20||sy>H+20||p.broken) continue;
      ctx.fillStyle = p.type==="b" ? "#a07b52" : (p.type==="m" ? this.t.accent : "#5cb85c");
      rr(p.x-p.w/2, sy, p.w, 12, 6); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.3)"; rr(p.x-p.w/2+2, sy+2, p.w-4, 4, 3); ctx.fill();
      if(p.type==="b"){ ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.moveTo(p.x-4,sy+2); ctx.lineTo(p.x+2,sy+10); ctx.stroke(); }
    }
    const sy=this.y-this.camY;
    ctx.save(); ctx.translate(this.x, sy-4);
    const st = Math.max(-0.18, Math.min(0.22, this.vy/2600));
    ctx.scale(1-st*0.7, 1+st);
    const flop = Math.max(-0.5, Math.min(0.5, this.vy/1400));
    ctx.lineWidth=2.2; ctx.strokeStyle="#3a4258";
    ctx.save(); ctx.translate(-6,-14); ctx.rotate(-0.22+flop*0.5);
    ctx.fillStyle="#ffffff"; rr(-4,-18,8,20,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#ffb3c9"; rr(-2,-14,4,12,2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(6,-14); ctx.rotate(0.22+flop*0.5);
    ctx.fillStyle="#ffffff"; rr(-4,-18,8,20,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#ffb3c9"; rr(-2,-14,4,12,2); ctx.fill(); ctx.restore();
    ctx.fillStyle="#ffffff"; rr(-14,-16,28,32,13); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#e9e9f2"; rr(-13,12,10,7,3.5); ctx.fill(); rr(3,12,10,7,3.5); ctx.fill();
    ctx.fillStyle="#10131c";
    ctx.beginPath(); ctx.arc(-5,-6,2.8,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-6,2.8,0,6.283); ctx.fill();
    ctx.fillStyle="#ffb3c9"; ctx.beginPath(); ctx.arc(0,-1,2.2,0,6.283); ctx.fill();
    ctx.restore();
    // summit marker
    const summitY = (H-90-this.P.target) - this.camY;
    if(summitY > -30){
      ctx.strokeStyle="#ffcf5c"; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(0,summitY); ctx.lineTo(W,summitY); ctx.stroke(); ctx.setLineDash([]);
      drawFlag(W-34, summitY+2, 1.1);
    }
    if(this.time<2.5){
      ctx.fillStyle="rgba(0,0,0,.45)"; rr(50,H-56,W-100,34,9); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("drag / arrows to steer — brown planks break!", W/2, H-34);
    }
  }
}

/* =====================================================================
   ENGINE 8 — RHYTHM RUNNER (tap to jump the spikes)
   ===================================================================== */
class Runner{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.groundY=H-90; this.px=90; this.py=this.groundY; this.prevPy=this.py;
    this.vy=0; this.rot=0; this.support=this.groundY;
    this.obs=[]; this.timer=0; this.spawnT=1.2; this.inv=0; this.groundOff=0;
    host.setProgress(`${P.time}s`);
  }
  onGround(){ return this.py >= this.support-0.5; }
  jump(){ if(this.onGround()){ this.vy=-760; Sfx.play("flap"); FX.burst(this.px, this.py+11, "#ffffff", 5, 90); } }
  onDown(){ this.jump(); }
  onKey(k){ if(k===" "||k==="ArrowUp"||k==="w") this.jump(); }
  revive(){ this.inv=1.5; this.obs=this.obs.filter(o=>o.x < this.px+60 || o.x > this.px+460); }
  progress(){ return this.timer / this.P.time; }
  makeOb(){
    const P=this.P, r=Math.random();
    if(P.blocks && r<0.24) return {kind:"block", x:W+50, w:34+(Math.random()*18|0), h:26+(Math.random()<0.4?24:0)};
    if(r<0.42) return {kind:"saw", x:W+50, r:19, ph:Math.random()*6.28};
    if(P.airsaws && r<0.58) return {kind:"airsaw", x:W+50, r:17, yc:this.groundY-58, ph:Math.random()*6.28};
    let n=1;
    if(P.triples && Math.random()<0.3) n=3;
    else if(P.doubles && Math.random()<0.45) n=2;
    return {kind:"spike", x:W+50, n};
  }
  hit(o){
    if(o.kind==="spike"){
      const w=o.n*22;
      return this.px+11 > o.x-w/2 && this.px-11 < o.x+w/2 && this.py > this.groundY-32;
    }
    if(o.kind==="saw"){
      return (o.x-this.px)**2 + (this.groundY+2-(this.py-2))**2 < (o.r+11)**2;
    }
    if(o.kind==="airsaw"){
      return (o.x-this.px)**2 + (o.yc-(this.py-2))**2 < (o.r+11)**2;
    }
    if(o.kind==="block"){
      const ts=this.groundY+11-o.h;   // block top surface
      return Math.abs(o.x-this.px) < o.w/2+10 && this.py+11 > ts+8;   // side hit; standing on top is safe
    }
    return false;
  }
  update(dt){
    this.timer += dt;
    if(this.inv>0) this.inv -= dt;
    const sp=this.P.speed*(1+0.15*Math.min(1,this.timer/this.P.time));
    this.groundOff=(this.groundOff+sp*dt)%40;
    const rem=this.P.time-this.timer;
    this.h.setProgress(`${Math.max(0,Math.ceil(rem))}s`);
    if(rem<=0 && !this.h.freeplay){ this.h.win(); return; }
    this.spawnT -= dt;
    if(this.spawnT<=0){
      this.spawnT = this.P.interval*(0.85+Math.random()*0.5);
      this.obs.push(this.makeOb());
    }
    for(const o of this.obs) o.x -= sp*dt;
    this.obs = this.obs.filter(o=>o.x > -90);
    // physics — ground or block tops carry the runner
    this.prevPy = this.py;
    this.vy += 2600*dt; this.py += this.vy*dt;
    let support = this.groundY;
    for(const o of this.obs){
      if(o.kind!=="block") continue;
      if(Math.abs(o.x-this.px) < o.w/2+11){
        const standPy = this.groundY - o.h;    // py when standing on this block
        if(this.prevPy <= standPy+6) support = Math.min(support, standPy);
      }
    }
    this.support = support;
    if(this.py > support){ this.py = support; this.vy=0; this.rot=0; }
    if(!this.onGround()) this.rot += 7*dt;
    if(this.inv<=0){
      for(const o of this.obs){
        if(this.hit(o)){ this.h.fail(); return; }
      }
    }
  }
  draw(){
    bgDark(this.t);
    // ground
    ctx.fillStyle=this.t.ground; ctx.fillRect(0,this.groundY+14,W,H-this.groundY);
    ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,this.groundY+14); ctx.lineTo(W,this.groundY+14); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.08)";
    for(let x=-this.groundOff; x<W; x+=40){
      ctx.beginPath(); ctx.moveTo(x,this.groundY+14); ctx.lineTo(x-14,H); ctx.stroke();
    }
    // obstacles
    for(const o of this.obs){
      if(o.kind==="spike"){
        const w=o.n*22;
        ctx.fillStyle=this.t.tile[0];
        for(let i=0;i<o.n;i++){
          const bx=o.x-w/2+i*22;
          ctx.beginPath(); ctx.moveTo(bx,this.groundY+14); ctx.lineTo(bx+11,this.groundY-16); ctx.lineTo(bx+22,this.groundY+14); ctx.closePath(); ctx.fill();
        }
      } else if(o.kind==="block"){
        const ts=this.groundY+11-o.h;
        ctx.fillStyle=this.t.tile[5];
        rr(o.x-o.w/2, ts, o.w, o.h+4, 4); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.22)";
        rr(o.x-o.w/2+3, ts+3, o.w-6, 6, 3); ctx.fill();
      } else {
        const cy = o.kind==="saw" ? this.groundY+2 : o.yc;
        ctx.save(); ctx.translate(o.x, cy); ctx.rotate(this.timer*9+o.ph);
        ctx.fillStyle="#c9ced9";
        for(let i=0;i<8;i++){ ctx.rotate(Math.PI/4); ctx.fillRect(-3, -o.r-5, 6, 7); }
        ctx.beginPath(); ctx.arc(0,0,o.r,0,6.283); ctx.fill();
        ctx.fillStyle="#8a90a0"; ctx.beginPath(); ctx.arc(0,0,o.r*0.45,0,6.283); ctx.fill();
        ctx.fillStyle="#565b6b"; ctx.beginPath(); ctx.arc(0,0,4,0,6.283); ctx.fill();
        ctx.restore();
      }
    }
    // player cube
    ctx.save();
    ctx.translate(this.px,this.py-2);
    ctx.rotate(this.rot);
    if(this.inv>0 && Math.floor(this.timer*10)%2===0) ctx.globalAlpha=.4;
    ctx.fillStyle=this.t.tile[3];
    rr(-13,-13,26,26,6); ctx.fill();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=2.5; rr(-13,-13,26,26,6); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.28)"; rr(-10,-10,20,7,3); ctx.fill();
    ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(-5,-3,4,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,4,0,6.283); ctx.fill();
    ctx.fillStyle="#10131c";
    ctx.beginPath(); ctx.arc(-4,-3,2,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-3,2,0,6.283); ctx.fill();
    ctx.strokeStyle="#10131c"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,4,5,0.3,2.85); ctx.stroke();
    ctx.restore();
    // time bar
    const frac=Math.min(1,this.timer/this.P.time);
    ctx.fillStyle="rgba(0,0,0,.4)"; rr(40,20,W-80,14,7); ctx.fill();
    ctx.fillStyle="#5ee08a"; rr(40,20,(W-80)*frac,14,7); ctx.fill();
    if(this.timer<2.5){
      ctx.fillStyle="rgba(0,0,0,.45)"; rr(70,H-56,W-140,34,9); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("TAP to jump — land ON blocks, avoid saws!", W/2, H-34);
    }
  }
}

/* =====================================================================
   ENGINE 9 — WALL NINJA (tap to leap wall to wall, climb)
   ===================================================================== */
class Ninja{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.wallX=(s)=>s<0 ? 54 : W-54;
    this.side=-1; this.hgt=0; this.jump=null; this.inv=0; this.time=0;
    this.started=false; this.buffered=false;   // wait for the first tap; buffer mid-dash taps
    this.py=H-230;                             // player's fixed screen position
    this.spikes=[]; this.shus=[]; this.shuT=2.4;
    this.crawlers=[]; this.crawlT=1.8; this.birds=[]; this.birdT=2.0;
    this._genH=280;
    this.genTo(P.target+400);
    this.updateHud();
  }
  genTo(limit){
    while(this._genH < limit){
      this._genH += this.P.spikeGap*(0.85+Math.random()*0.4);
      this.spikes.push({side: Math.random()<0.5?-1:1, y:this._genH, len:70});
    }
  }
  updateHud(){ this.h.setProgress(`${Math.max(0,Math.round(this.hgt))} / ${this.P.target} m`); }
  screenY(h){ return this.py + (this.hgt - h); }
  onDown(){ this.leap(); }
  onKey(k){ if(k===" "||k==="ArrowUp"||k==="w") this.leap(); }
  leap(){
    this.started = true;
    if(this.jump){ this.buffered = true; return; }   // queue the tap for landing
    this.jump={t:0, dur:0.28, from:this.side};
    Sfx.play("flap");
    FX.burst(this.wallX(this.side), this.py, "#ffffff", 5, 90);
  }
  px(){
    if(!this.jump) return this.wallX(this.side);
    const t=Math.min(1, this.jump.t/this.jump.dur);
    return this.wallX(this.jump.from) + (this.wallX(-this.jump.from)-this.wallX(this.jump.from))*t;
  }
  spikeHit(){
    if(this.inv>0 || this.jump) return false;   // airborne = safe from wall spikes
    for(const s of this.spikes){
      if(s.side===this.side && this.hgt > s.y-14 && this.hgt < s.y+s.len+14) return true;
    }
    return false;
  }
  revive(){
    this.spikes = this.spikes.filter(s=>Math.abs(s.y-this.hgt) > 180);
    this.crawlers = this.crawlers.filter(c=>Math.abs(c.y-this.hgt) > 180);
    this.shus=[]; this.birds=[]; this.jump=null; this.buffered=false; this.inv=1.2;
  }
  progress(){ return Math.max(0,this.hgt) / this.P.target; }
  update(dt){
    this.time += dt;
    if(this.inv>0) this.inv -= dt;
    if(!this.started) return;   // hold still until the first tap
    this.hgt += this.P.climb*dt;               // NinJump: the ninja always climbs
    this.genTo(this.hgt + 700);                // keep spikes coming (also feeds bonus play)
    if(this.jump){
      const j=this.jump; j.t += dt;
      if(j.t >= j.dur){
        this.side = -j.from; this.jump=null;
        Sfx.play("tap");
        if(this.buffered){
          this.buffered=false;
          if(this.spikeHit()){ FX.kick(14); this.h.fail(); return; }
          this.leap();
        }
      }
    }
    if(this.spikeHit()){ FX.kick(14); this.h.fail(); return; }
    // shurikens fly in across the tower at higher difficulty
    if(this.P.shurikens){
      this.shuT -= dt;
      if(this.shuT<=0){
        this.shuT = 2.4;
        const fromLeft = Math.random()<0.5;
        this.shus.push({y:this.hgt + 260 + Math.random()*120, x:fromLeft?70:W-70, vx:fromLeft?240:-240});
      }
      for(const s of this.shus) s.x += s.vx*dt;
      this.shus = this.shus.filter(s=>s.x>50 && s.x<W-50 && this.screenY(s.y) < H+40);
      if(this.inv<=0){
        const p = this.px();
        for(const s of this.shus){
          if(Math.abs(s.x-p)<22 && Math.abs(this.screenY(s.y)-this.py)<24){ FX.kick(14); this.h.fail(); return; }
        }
      }
    }
    // wall crawlers slither down toward the ninja — leap past them
    if(this.P.crawlers){
      this.crawlT -= dt;
      if(this.crawlT<=0){
        this.crawlT = 2.0;
        this.crawlers.push({side: Math.random()<0.5?-1:1, y:this.hgt + 420, spd: 60+Math.random()*50});
      }
      for(const c of this.crawlers) c.y -= c.spd*dt;
      this.crawlers = this.crawlers.filter(c=>this.screenY(c.y) < H+40);
      if(this.inv<=0 && !this.jump){
        for(const c of this.crawlers){
          if(c.side===this.side && this.hgt > c.y-16 && this.hgt < c.y+46){ FX.kick(14); this.h.fail(); return; }
        }
      }
    }
    // birds cross the middle — deadly only mid-leap (don't jump into them!)
    if(this.P.birds){
      this.birdT -= dt;
      if(this.birdT<=0){
        this.birdT = 2.6;
        const fromLeft = Math.random()<0.5;
        this.birds.push({y:this.hgt + 300 + Math.random()*140, x:fromLeft?95:W-95, vx:(fromLeft?1:-1)*(150+Math.random()*70)});
      }
      for(const b of this.birds) b.x += b.vx*dt;
      this.birds = this.birds.filter(b=>b.x>80 && b.x<W-80 && this.screenY(b.y) < H+40);
      if(this.inv<=0 && this.jump){
        const p=this.px();
        for(const b of this.birds){
          if(Math.abs(b.x-p)<24 && Math.abs(this.screenY(b.y)-this.py)<26){ FX.kick(14); this.h.fail(); return; }
        }
      }
    }
    this.updateHud();
    if(this.hgt >= this.P.target && !this.h.freeplay){ this.h.win(); return; }
  }
  draw(){
    bgDark(this.t);
    // walls scroll downward as the ninja climbs
    ctx.fillStyle=this.t.ground; ctx.fillRect(0,0,40,H); ctx.fillRect(W-40,0,40,H);
    ctx.fillStyle="rgba(255,255,255,.06)";
    const off = this.hgt % 60;
    for(let y=off-60; y<H; y+=60){ ctx.fillRect(0,y,40,8); ctx.fillRect(W-40,y,40,8); }
    // spikes
    for(const s of this.spikes){
      const top=this.screenY(s.y+s.len), bot=this.screenY(s.y);
      if(bot<-30||top>H+30) continue;
      ctx.fillStyle=this.t.tile[0];
      const base = s.side<0 ? 40 : W-40, dir = s.side<0 ? 1 : -1;
      for(let y=top; y<bot; y+=18){
        ctx.beginPath(); ctx.moveTo(base,y); ctx.lineTo(base+dir*16,y+9); ctx.lineTo(base,y+18); ctx.closePath(); ctx.fill();
      }
    }
    // shurikens
    for(const s of this.shus){
      ctx.save(); ctx.translate(s.x,this.screenY(s.y)); ctx.rotate(this.time*10);
      ctx.fillStyle="#c9ced9";
      for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(12,-9); ctx.lineTo(4,3); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle="#565b6b"; ctx.beginPath(); ctx.arc(0,0,3.4,0,6.283); ctx.fill();
      ctx.fillStyle="#c9ced9"; ctx.beginPath(); ctx.arc(0,0,1.6,0,6.283); ctx.fill();
      ctx.restore();
    }
    // wall crawlers
    for(const c of this.crawlers){
      const sy=this.screenY(c.y);
      if(sy<-30||sy>H+30) continue;
      const bx = c.side<0 ? 53 : W-53;
      ctx.save(); ctx.translate(bx, sy);
      if(c.side>0) ctx.scale(-1,1);
      ctx.fillStyle="#9be05c";
      rr(-10,-14,20,28,9); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=1.5; rr(-10,-14,20,28,9); ctx.stroke();
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(-2,-6,3.4,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(5,-6,3.4,0,6.283); ctx.fill();
      ctx.fillStyle="#10131c";
      ctx.beginPath(); ctx.arc(-1,-6,1.8,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(6,-6,1.8,0,6.283); ctx.fill();
      ctx.restore();
    }
    // birds (mid-air hazards)
    for(const b of this.birds){
      const sy=this.screenY(b.y);
      if(sy<-30||sy>H+30) continue;
      ctx.save(); ctx.translate(b.x, sy + Math.sin(this.time*8+b.x)*3);
      if(b.vx<0) ctx.scale(-1,1);
      const flap = Math.sin(this.time*16+b.x)*5;
      ctx.fillStyle=this.t.tile[5];
      ctx.beginPath(); ctx.ellipse(0,0,11,7.5,0,0,6.283); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle="rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.moveTo(-2,-2); ctx.quadraticCurveTo(-8,-11-flap,-16,-5-flap); ctx.quadraticCurveTo(-8,-1,-2,-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#ffcf5c";
      ctx.beginPath(); ctx.moveTo(10,-1); ctx.lineTo(17,1); ctx.lineTo(10,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(5,-2.5,2.8,0,6.283); ctx.fill();
      ctx.fillStyle="#10131c"; ctx.beginPath(); ctx.arc(6,-2.5,1.4,0,6.283); ctx.fill();
      ctx.restore();
    }
    // summit
    const summitY=this.screenY(this.P.target);
    if(summitY>-30 && summitY<H+30){
      ctx.strokeStyle="#ffcf5c"; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(40,summitY); ctx.lineTo(W-40,summitY); ctx.stroke(); ctx.setLineDash([]);
      drawFlag(W-62, summitY+2, 1.1);
    }
    // player — big cartoon ninja, always facing away from his wall
    const p=this.px(), dir = this.jump ? (this.jump.from<0?1:-1) : (this.side<0?1:-1);
    ctx.save();
    ctx.translate(p, this.py);
    ctx.scale(dir,1);
    if(this.inv>0 && Math.floor(this.time*10)%2===0) ctx.globalAlpha=.4;
    const bob = this.jump ? 0 : Math.sin(this.time*14)*1.6;
    // headband tails flutter behind
    ctx.strokeStyle="#ffcf5c"; ctx.lineWidth=4; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-9,-14+bob);
    ctx.quadraticCurveTo(-21,-17+bob+Math.sin(this.time*9)*3, -29,-11+bob+Math.sin(this.time*7)*4);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9,-14+bob);
    ctx.quadraticCurveTo(-19,-8+bob+Math.sin(this.time*8)*3, -27,-2+bob+Math.sin(this.time*6)*4);
    ctx.stroke();
    // body
    ctx.fillStyle=this.t.tile[4];
    rr(-15,-18+bob,30,36,12); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=2;
    rr(-15,-18+bob,30,36,12); ctx.stroke();
    // belt
    ctx.fillStyle="rgba(0,0,0,.25)"; rr(-15,3+bob,30,6,3); ctx.fill();
    // face opening + big eyes looking up
    ctx.fillStyle="#fff"; rr(-10,-13+bob,23,12,6); ctx.fill();
    ctx.fillStyle="#10131c";
    ctx.beginPath(); ctx.ellipse(-2,-8+bob,2.7,3.6,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-8+bob,2.7,3.6,0,0,6.283); ctx.fill();
    // headband
    ctx.fillStyle="#ffcf5c"; rr(-13,-17+bob,26,5,2.5); ctx.fill();
    ctx.restore();
    if(!this.started || this.time<2.5){
      ctx.fillStyle="rgba(0,0,0,.45)"; rr(70,H-56,W-140,34,9); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("TAP to switch walls — dodge the spikes!", W/2, H-34);
    }
  }
}

/* =====================================================================
   ENGINE 10 — SWING KING (hold to swing on pins, release to fly)
   ===================================================================== */
class Swing{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.pins=[]; this._genPy=H/2; this._genPx=260;
    this.genTo(260 + P.spacing*P.pins);
    this.goalX = this._genPx + 60;
    this.x=60; this.y=H/2; this.vx=300; this.vy=0;
    this.cam=0; this.att=null; this.inv=0; this.time=0; this.trail=[];
    this.passed=0; this.lastPin=null;
    host.setProgress(`0 / ${P.pins} pins`);
  }
  genTo(limit){
    while(this._genPx < limit){
      this._genPy = Math.max(this.P.margin+130, Math.min(H-this.P.margin-130, this._genPy + (Math.random()-0.5)*160));
      this.pins.push({x:this._genPx, y:this._genPy, baseY:this._genPy, ph:Math.random()*6.28, passed:false});
      this._genPx += this.P.spacing;
    }
  }
  onDown(){ this.attach(); }
  onUp(){ this.release(); }
  onKey(k){ if(k===" "){ this.att ? this.release() : this.attach(); } }
  attach(){
    if(this.att) return;
    // prefer pins ahead of the rider; fall back to any pin in range
    let best=null, bd=200*200;
    for(const p of this.pins){
      if(p.x <= this.x+10) continue;
      const dd=(p.x-this.x)**2+(p.y-this.y)**2;
      if(dd<bd){ bd=dd; best=p; }
    }
    if(!best){
      bd=200*200;
      for(const p of this.pins){
        if(p.x < this.x-80) continue;
        const dd=(p.x-this.x)**2+(p.y-this.y)**2;
        if(dd<bd){ bd=dd; best=p; }
      }
    }
    if(!best) return;
    const r=Math.max(45, Math.min(165, Math.sqrt(bd)));
    const relx=this.x-best.x, rely=this.y-best.y;
    const speed=Math.max(300, Math.min(540, Math.hypot(this.vx,this.vy)));
    const dir=Math.sign(relx*this.vy - rely*this.vx) || 1;
    this.att={pin:best, r, ang:Math.atan2(rely,relx), w:dir*speed/r};
    Sfx.play("tap");
  }
  release(){
    if(!this.att) return;
    const a=this.att;
    this.vx = -a.r*Math.sin(a.ang)*a.w;
    this.vy =  a.r*Math.cos(a.ang)*a.w;
    this.att=null;
    Sfx.play("flap");
    FX.burst(this.x,this.y,"#ffffff",6,110);
  }
  revive(){
    const p=this.lastPin || this.pins[0];
    this.x=p.x; this.y=Math.min(Math.max(p.y, this.P.margin+80), H-this.P.margin-80);
    this.vx=300; this.vy=0; this.att=null; this.inv=1.4;
    this.cam=Math.max(0, this.x-140);
  }
  progress(){ return this.passed / this.P.pins; }
  update(dt){
    this.time += dt;
    if(this.inv>0) this.inv -= dt;
    if(this.P.moving) for(const p of this.pins) p.y = p.baseY + Math.sin(this.time*1.4+p.ph)*28;
    if(this.att){
      const a=this.att;
      if(this.P.moving){ /* pin drags the rider */ }
      a.ang += a.w*dt;
      this.x = a.pin.x + a.r*Math.cos(a.ang);
      this.y = a.pin.y + a.r*Math.sin(a.ang);
    } else {
      this.vy += this.P.grav*dt;
      this.x += this.vx*dt; this.y += this.vy*dt;
      // safety grab: falling toward the bottom spikes with a pin in reach → auto-attach
      if(this.vy > 0 && this.y > H-this.P.margin-70) this.attach();
    }
    for(const p of this.pins){
      if(!p.passed && this.x > p.x){
        p.passed=true; this.passed++; this.lastPin=p;
        Sfx.play("pass");
        this.h.setProgress(`${this.passed} / ${this.P.pins} pins`);
      }
    }
    this.trail.push({x:this.x,y:this.y,t:0.5});
    if(this.trail.length>24) this.trail.shift();
    for(const tr of this.trail) tr.t -= dt;
    this.cam = Math.max(this.cam, this.x-140);
    this.genTo(this.x + 900);   // keep pins coming (also feeds bonus play)
    if(this.inv<=0){
      if(this.y < this.P.margin || this.y > H-this.P.margin){ FX.kick(14); this.h.fail(); return; }
      if(this.x < this.cam-40){ this.h.fail(); return; }
    } else {
      this.y = Math.min(Math.max(this.y, this.P.margin+10), H-this.P.margin-10);
    }
    if((this.passed >= this.P.pins || this.x > this.goalX) && !this.h.freeplay){ this.h.win(); return; }
  }
  draw(){
    bgDark(this.t);
    ctx.save();
    ctx.translate(-this.cam, 0);
    // kill zones
    ctx.fillStyle=this.t.tile[0];
    const m=this.P.margin;
    for(let x=Math.floor(this.cam/24)*24; x<this.cam+W+24; x+=24){
      ctx.beginPath(); ctx.moveTo(x,m-14); ctx.lineTo(x+12,m+4); ctx.lineTo(x+24,m-14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x,H-m+14); ctx.lineTo(x+12,H-m-4); ctx.lineTo(x+24,H-m+14); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(this.cam,0,W,m-12); ctx.fillRect(this.cam,H-m+12,W,m-12);
    // pins
    for(const p of this.pins){
      if(p.x<this.cam-40||p.x>this.cam+W+40) continue;
      ctx.fillStyle = p.passed ? "#5ee08a" : "#ffcf5c";
      ctx.beginPath(); ctx.arc(p.x,p.y,7,0,6.283); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(p.x,p.y,12,0,6.283); ctx.stroke();
    }
    // goal flag
    drawFlag(this.goalX, H/2+18, 1.7);
    // rope
    if(this.att){
      ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(this.att.pin.x,this.att.pin.y); ctx.lineTo(this.x,this.y); ctx.stroke();
      ctx.lineWidth=1;
    }
    // trail
    for(const tr of this.trail){
      if(tr.t<=0) continue;
      ctx.globalAlpha = tr.t;
      ctx.fillStyle="#ffffff44";
      ctx.beginPath(); ctx.arc(tr.x,tr.y,4,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    // player orb
    if(this.inv>0 && Math.floor(this.time*10)%2===0) ctx.globalAlpha=.4;
    const g=ctx.createRadialGradient(this.x-4,this.y-4,2,this.x,this.y,13);
    g.addColorStop(0,"#ffffff"); g.addColorStop(1,this.t.tile[3]);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,13,0,6.283); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(this.x,this.y,13,0,6.283); ctx.stroke();
    ctx.fillStyle="#ffcf5c"; rr(this.x-11,this.y-9,22,4.5,2); ctx.fill();
    const _va=Math.atan2(this.vy,this.vx), _ex=Math.cos(_va)*1.6, _ey=Math.sin(_va)*1.6;
    ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(this.x-4.5,this.y+1,3.4,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x+4.5,this.y+1,3.4,0,6.283); ctx.fill();
    ctx.fillStyle="#10131c";
    ctx.beginPath(); ctx.arc(this.x-4.5+_ex,this.y+1+_ey,1.7,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x+4.5+_ex,this.y+1+_ey,1.7,0,6.283); ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
    if(this.time<2.5){
      ctx.fillStyle="rgba(0,0,0,.45)"; rr(50,H-56,W-100,34,9); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("HOLD to swing on a pin — RELEASE to fly", W/2, H-34);
    }
  }
}

/* =====================================================================
   HOME / LEVEL SELECT
   ===================================================================== */
function mapUnlocked(i){ return S.testMode || i===0 || S.prog[i-1] >= 25; }

function renderHome(){
  const list = $("maplist"); list.innerHTML="";
  THEMES.forEach((t,i)=>{
    const unlocked = mapUnlocked(i);
    const card = document.createElement("div");
    card.className = "mapcard" + (unlocked?"":" locked");
    const pct = Math.round(S.prog[i]/25*100);
    card.innerHTML = `
      <div class="mapswatch" style="background:linear-gradient(135deg,${t.sky[0]},${t.sky[1]})">${unlocked?zicon(i,32):ic("lock",24)}</div>
      <div class="info"><b>Zone ${i+1}</b>
        <div class="prog">${unlocked? S.prog[i]+" / 25 levels" : "Complete Zone "+i+" to unlock"}</div>
        <div class="progressbar"><i style="width:${pct}%"></i></div>
      </div>
      <div style="display:flex;color:var(--dim)">${S.prog[i]>=25?ic("check",20):ic("chev",18)}</div>`;
    if(unlocked) card.onclick = ()=>openLevels(i);
    list.appendChild(card);
  });
}

function openLevels(mi){
  Host.map = mi;
  const t = THEMES[mi];
  $("maptitle").innerHTML = `${zicon(mi,22)} Zone ${mi+1}`;
  $("mapsub").textContent = `${S.prog[mi]} / 25 complete`;
  // theme the whole screen with the zone's palette
  $("screen-levels").style.background =
    `radial-gradient(90% 50% at 50% -8%, ${t.accent}40, transparent 62%),`+
    `linear-gradient(180deg, ${t.dark} 0%, #0b0e18 80%)`;
  const wrap = $("levelgrid"); wrap.innerHTML="";
  // serpentine trail: level 1 bottom-left, climbing to 25 at the top
  const pos = [];
  for(let l=1;l<=25;l++){
    const r = Math.floor((l-1)/5), ci = (l-1)%5;
    const c = (r%2===0) ? ci : 4-ci;
    pos.push({x:(c+0.5)*20, y:90 - r*20 + (c%2 ? 3 : -3), l});
  }
  const reach = Math.min(S.prog[mi]+1, 25);
  const pts = a=>a.map(p=>`${p.x},${p.y}`).join(" ");
  wrap.innerHTML =
    `<div class="zwm">${zicon(mi,190)}</div>
     <svg class="pathsvg" viewBox="0 0 100 100" preserveAspectRatio="none">
       <polyline points="${pts(pos.slice(reach-1))}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
       <polyline points="${pts(pos.slice(0,reach))}" fill="none" stroke="${t.accent}" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
     </svg>`;
  pos.forEach(({x,y,l})=>{
    const el = document.createElement("div");
    const done = l <= S.prog[mi];
    const current = l === S.prog[mi]+1;
    el.className = "lvn " + (done?"done":current?"current":"locked") + (l===25?" final":"");
    el.style.left = x+"%"; el.style.top = y+"%";
    el.innerHTML = `${l===25?ic("crown",20):l}` +
      (UNIQUE_LEVELS.includes(l)?`<span class="star">${ic("star",12)}</span>`:"") +
      (l%5===0&&l!==25?`<span class="tag">${ic("leaf",12)}</span>`:"") +
      (current?`<span class="youmark">${S.profile.avatar}</span>`:"");

}

/* ---------------- toasts & notifications ---------------- */
function goalBanner(title, sub){
  const old = document.getElementById("goalbanner"); if(old) old.remove();
  const b = document.createElement("div"); b.id = "goalbanner";
  b.innerHTML = '<div class="gb-burst"></div><div class="gb-txt">'+title+'</div><div class="gb-sub">'+sub+'</div>';
  $("app").appendChild(b);
  setTimeout(()=>{ b.style.opacity = "0"; setTimeout(()=>b.remove(), 420); }, 1700);
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition = "opacity .4s"; t.style.opacity = "0";
    setTimeout(()=>t.remove(), 400); }, 2600);
}
function notify(title, body){
  if(!S.notifications) return;
  try{
    // real push only when the tab is hidden and permission granted; else in-app toast
    if(typeof Notification !== "undefined" && Notification.permission === "granted" && document.hidden){
      new Notification(title, {body}); return;
    }
  }catch(e){}
  toast(body ? `${title} — ${body}` : title);
}
function toggleNotifications(){
  if(S.notifications){ S.notifications = false; save(); toast(ic("bell",14)+" Notifications off"); return; }
  const enableInApp = (msg)=>{ S.notifications = true; save(); toast(msg); };
  try{
    if(typeof Notification !== "undefined" && Notification.requestPermission){
      Notification.requestPermission().then(perm=>{
        enableInApp(perm === "granted" ? "Notifications on (browser + in-app)"
                                       : "In-app notifications on");
      }).catch(()=>enableInApp("In-app notifications on"));
    } else enableInApp("In-app notifications on");
  }catch(e){ enableInApp("In-app notifications on"); }
}

/* ---------------- daily bonus (habit-loop research: low-friction streak) -------- */
function checkDailyBonus(){
  const today = new Date().toDateString();
  if(S.lastDaily === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  S.dailyStreak = (S.lastDaily === yesterday) ? S.dailyStreak + 1 : 1;
  S.lastDaily = today;
  save();
  const dayIdx = ((S.dailyStreak-1) % 7) + 1;
  // escalating 7-day gift — a small daily drip building to a golden Day 7; cycle repeats
  const GIFT_TABLE = [
    {coins:50},
    {coins:60,  lives:1},
    {coins:75,  continues:1},
    {coins:80,  rerolls:1},
    {coins:100, lives:1},
    {coins:120, picks:1},
    {coins:250, continues:2, lives:2, picks:1, chests:1},
  ];
  const CALICONS = [ic("coin",20),ic("heart",20),ic("rewind",20),ic("dice",20),ic("heart",20),ic("target",20),ic("gift",20)];
  const g = GIFT_TABLE[dayIdx-1];
  const giftLine = [
    `${ic("coin",12)} +${g.coins}`,
    g.lives     ? `${ic("heart",12)} +${g.lives}`      : null,
    g.continues ? `${ic("rewind",12)} +${g.continues}` : null,
    g.rerolls   ? `${ic("dice",12)} +${g.rerolls}`     : null,
    g.picks     ? `${ic("target",12)} +${g.picks}`     : null,
    g.chests    ? `${ic("gift",12)} +${g.chests}`      : null,
  ].filter(Boolean).join(" · ");
  const cells = CALICONS.map((gi,i)=>{
    const n = i+1;
    const cls = "cal-d" + (n===7?" d7":"") + (n<dayIdx?" past": n===dayIdx?" today":"");
    return '<div class="'+cls+'"><small>Day '+n+'</small><div class="cal-i">'+(n<dayIdx?ic("check",18):gi)+'</div>'+(n===dayIdx?'<b>TODAY</b>':'')+'</div>';
  }).join("");
  modal({title:`${ic("gift",18)} Daily Gift — Day ${S.dailyStreak}`, bodyHTML:
    `<div class="cal7">${cells}</div>
     <div class="body" style="margin-top:10px">Today's gift: <b>${giftLine}</b></div>
     <div class="body"><small>Come back tomorrow to keep the streak — Day 7 is golden!</small></div>`,
    buttons:[{label:"Collect!", cls:"green", fn:()=>{
      S.coins += g.coins;
      S.continues += g.continues||0; S.lives += g.lives||0;
      S.rerolls += g.rerolls||0; S.picks += g.picks||0; S.chests += g.chests||0;
      save(); refreshTop(); Sfx.play("daily");
      toast(ic("gift",14)+" Daily gift collected!");
    }}]});
}
