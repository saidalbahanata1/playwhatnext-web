<title>What Next — every level, the game decides</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1120">
<style>
  :root{
    --bg:#0e1120; --panel:#1d2338; --panel2:#293049; --text:#f2f4fd; --dim:#9aa3bf;
    --gold:#ffcf5c; --gold2:#ff9d3c; --green:#5ee08a; --red:#ff6b6b; --blue:#5cb2ff; --purple:#b48cff;
    --ink:#241d0d; --line:#333c5e;
    --disp:'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  }
  /* light mode — swaps the UI palette; mini-games keep their themed art */
  html.light{
    --bg:#eef1f9; --panel:#ffffff; --panel2:#e4e9f5; --text:#232a44; --dim:#5f6884;
    --line:#cfd6e8;
  }
  html.light .ic svg [fill="#cdd4ee"]{fill:#5f6884;}
  html.light .ic svg [stroke="#cdd4ee"]{stroke:#5f6884;}
  html.light #app{
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255,207,92,.18), transparent 60%),
      radial-gradient(rgba(35,42,68,.05) 1px, transparent 1.5px),
      linear-gradient(180deg,#f5f7fd 0%, #e7ebf6 100%);
    background-size:auto, 23px 23px, auto;
  }
  html.light #topbar, html.light #gamehud{background:rgba(255,255,255,.65); border-bottom:1px solid rgba(35,42,68,.08);}
  html.light .pill, html.light #hudprogress, html.light .cal-d, html.light .shopitem{background:#ffffff;}
  html.light .pill{box-shadow:inset 0 2px 5px rgba(35,42,68,.08);}
  html.light .iconbtn, html.light .mp, html.light .av, html.light .btn.togrow{
    background:linear-gradient(180deg,#ffffff,#e9edf7); border-color:#cfd6e8; box-shadow:0 3px 0 #b9c2d8; color:var(--text);}
  html.light .iconbtn:active, html.light .mp:active{box-shadow:0 1px 0 #b9c2d8;}
  html.light .wm-t{background:linear-gradient(180deg,#ffffff,#e7ebf6); border-color:#cfd6e8; box-shadow:0 4px 0 #b9c2d8, inset 0 2px 0 rgba(255,255,255,.9);}
  html.light .wm-t.q{color:#c8891f; background:linear-gradient(180deg,#fffdf4,#f6eed6); border-color:var(--gold); box-shadow:0 4px 0 #d9c9a0, 0 0 16px rgba(255,207,92,.35);}
  html.light .mapcard{background:linear-gradient(180deg,#ffffff,#eef1f9); box-shadow:0 4px 0 #ccd4e6;}
  html.light .mapcard:active{box-shadow:0 2px 0 #ccd4e6;}
  html.light .progressbar{background:#d8deec; box-shadow:inset 0 1px 3px rgba(35,42,68,.2);}
  html.light .lvn{background:linear-gradient(180deg,#ffffff,#e7ebf6); border-color:#c4cce0; box-shadow:0 4px 0 rgba(35,42,68,.16);}
  html.light .lvn.done{color:#1d6a3e; background:linear-gradient(180deg,#d8f5e2,#b9ecc9); border-color:#46c979;}
  html.light .youmark{background:#ffffff;}
  html.light .btn.secondary{background:linear-gradient(180deg,#ffffff,#e2e7f3); color:var(--text); box-shadow:0 4px 0 #b9c2d8;}
  html.light #modal-root{background:rgba(35,42,68,.4);}
  html.light .modal{background:linear-gradient(180deg,#ffffff,#eef1f9); border-color:#cfd6e8; box-shadow:0 24px 60px rgba(35,42,68,.35);}
  html.light .slotwin{background:#e7ebf6; border-color:#c4cce0; box-shadow:inset 0 10px 20px rgba(35,42,68,.12), inset 0 -10px 20px rgba(35,42,68,.12), 0 0 0 4px rgba(255,207,92,.12);}
  html.light .slotwin::before{background:linear-gradient(180deg,rgba(238,241,249,.95),transparent);}
  html.light .slotwin::after{background:linear-gradient(0deg,rgba(238,241,249,.95),transparent);}
  html.light .rollname{color:#c8891f; text-shadow:none;}
  html.light .rollname.spinning{color:#5f6884;}
  html.light .adbox{background:#e7ebf6; color:#5f6884;}
  html.light .toast{background:#fffffff2; border-color:#cfd6e8; box-shadow:0 6px 18px rgba(35,42,68,.25); }
  html.light .reg-input{background:#ffffff; border-color:#cfd6e8;}
  html.light .sw{background:#d8deec;}
  html.light .scrollhint{color:#c8891f; text-shadow:0 0 8px rgba(255,255,255,.95), 0 2px 4px rgba(255,255,255,.85);}
  html.light #banner{background:#ffffff; border-top-color:#cfd6e8;}
  html.light #bannerbody b, html.light.in-app #bannerbody b{color:var(--text);}
  html.light #bannerbody small, html.light.in-app #bannerbody small{color:var(--dim);}
  html.light .note{color:#7c85a3;}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; justify-content:center; overflow:hidden;
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{
    width:100%; max-width:430px;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255,207,92,.09), transparent 60%),
      radial-gradient(rgba(255,255,255,.028) 1px, transparent 1.5px),
      linear-gradient(180deg,#151a2c 0%, #0d1019 100%);
    background-size:auto, 23px 23px, auto;
    position:relative; overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }
  /* ---- Top bar ---- */
  #topbar{
    display:flex; align-items:center; gap:6px; padding:10px 10px;
    background:rgba(4,6,12,.45); border-bottom:1px solid rgba(255,255,255,.05); flex:0 0 auto; z-index:5;
  }
  #pillrow{display:flex; align-items:center; gap:6px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none;}
  #pillrow::-webkit-scrollbar{display:none;}
  #pillrow.scrollable{
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent);
  }
  .pill{
    flex:0 0 auto;
    background:#141929; border:1px solid var(--line); border-radius:20px; padding:4px 9px; font-size:12.5px;
    font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.45); font-family:var(--disp);
  }
  .pill small{font-weight:400; color:var(--dim); font-size:10px;}
  #topbar .spacer{flex:1;}
  .iconbtn{
    background:linear-gradient(180deg,#333c5e,#252c45); border:1px solid #3d4668; color:var(--text);
    border-radius:11px; width:34px; height:34px; font-size:16px; cursor:pointer; flex:0 0 auto;
    box-shadow:0 3px 0 #14192a;
  }
  .iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #14192a;}
  @media (max-width:430px){
    .pill{padding:4px 7px; font-size:12px; gap:4px;}
    #pillrow{gap:5px;}
  }
  /* ---- Screens ---- */
  .screen{flex:1; overflow:hidden; display:none; padding:12px 16px; min-height:0;}
  .screen.active{display:flex; flex-direction:column;}
  /* ---- Wordmark ---- */
  .wordmark{display:flex; flex-direction:column; align-items:center; gap:6px; margin:8px 0 8px; flex:0 0 auto;}
  .wm-row{display:flex; gap:5px;}
  .wm-t{
    width:44px; height:48px; display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-size:27px; font-weight:900; color:var(--text);
    background:linear-gradient(180deg,#2e3654,#20263c); border:1px solid #3d4668; border-radius:11px;
    box-shadow:0 4px 0 #12162a, inset 0 2px 0 rgba(255,255,255,.09);
  }
  .wm-t:nth-child(odd){transform:rotate(-2.5deg);}
  .wm-t:nth-child(even){transform:rotate(2deg);}
  .wm-t.g{color:var(--ink); background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#f0a93a); border-color:#c8891f; box-shadow:0 4px 0 #8f6114, inset 0 2px 0 rgba(255,255,255,.4);}
  .wm-t.q{color:var(--gold); background:linear-gradient(180deg,#12162a,#1c2238); border-color:var(--gold); box-shadow:0 4px 0 #12162a, 0 0 16px rgba(255,207,92,.35);}
  .tagline{text-align:center; color:var(--dim); font-size:12.5px; margin-bottom:12px; flex:0 0 auto;}
  /* map cards */
  #maplist{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; justify-content:center;}
  .mapcard{
    background:linear-gradient(180deg,#232a45,#1b2136); border-radius:18px; padding:10px 16px;
    flex:1; min-height:0; max-height:88px; overflow:hidden;
    display:flex; align-items:center; gap:14px; cursor:pointer; border:1px solid var(--line);
    box-shadow:0 4px 0 #10141f; transition:transform .1s;
  }
  .mapcard:active{transform:translateY(2px); box-shadow:0 2px 0 #10141f;}
  .mapcard.locked{opacity:.45; cursor:default;}
  .mapswatch{width:54px; height:54px; border-radius:14px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.25), inset 0 -10px 14px rgba(0,0,0,.28);}
  .mapcard .info{flex:1;}
  .mapcard .info b{font-size:16px; font-family:var(--disp); letter-spacing:.3px;}
  .mapcard .info .prog{font-size:12px; color:var(--dim); margin-top:3px;}
  .progressbar{height:8px; background:#0d1019; border-radius:4px; margin-top:7px; overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  .progressbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:4px;
    box-shadow:0 0 8px rgba(255,207,92,.45);}
  /* level path (board-game trail, level 1 at the bottom) */
  #levelgrid{position:relative; flex:1; min-height:0; width:100%; max-width:420px; margin:6px auto 0; align-self:center;}
  .pathsvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .zwm{position:absolute; right:-14px; top:-10px; opacity:.08; pointer-events:none; z-index:0;}
  .lvn{
    position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:800; font-size:15px; cursor:pointer;
    background:linear-gradient(180deg,#2b3350,#232a42); border:2.5px solid #39415f;
    box-shadow:0 4px 0 rgba(0,0,0,.35); color:var(--text); z-index:2;
  }
  .lvn.locked{width:38px; height:38px; margin:-19px 0 0 -19px; opacity:.55; cursor:default;
    font-size:12.5px; color:var(--dim); box-shadow:none;}
  .lvn.done{background:linear-gradient(180deg,#2f7a4e,#1d4a32); border-color:#46c979; color:#8affb6;}
  .lvn.current{width:54px; height:54px; margin:-27px 0 0 -27px; background:linear-gradient(180deg,#57431c,#3a3320);
    border-color:var(--gold); color:var(--gold); font-size:18px;
    box-shadow:0 4px 0 #2a230f, 0 0 22px rgba(255,207,92,.4); z-index:3;}
  .lvn.final{border-color:var(--red);}
  .lvn .star{position:absolute; top:-5px; right:-5px;}
  .lvn .tag{position:absolute; bottom:-5px; right:-5px;}
  .youmark{position:absolute; left:50%; bottom:100%; margin-bottom:7px; font-size:18px;
    background:#141929; border:1.5px solid var(--gold); border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.45);
    transform:translateX(-50%);}
  .youmark::after{content:""; position:absolute; top:100%; left:50%; margin-left:-4px;
    border:4px solid transparent; border-top-color:var(--gold);}
  @media (prefers-reduced-motion: no-preference){
    .lvn.current{animation:pulse 1.4s infinite;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    .youmark{animation:youbob 1.6s ease-in-out infinite;}
    @keyframes youbob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
  }
  .backrow{display:flex; align-items:center; gap:10px;}
  .backrow h2{font-size:20px; font-family:var(--disp); letter-spacing:.3px;}
  .backrow .sub{color:var(--dim); font-size:12px;}
  /* ---- Game screen ---- */
  #screen-game{padding:0; display:none; flex-direction:column;}
  #screen-game.active{display:flex;}
  #gamehud{
    display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px;
    background:rgba(4,6,12,.5); border-bottom:1px solid rgba(255,255,255,.05); flex:0 0 auto;
  }
  #hudobjective{flex:1; color:var(--text); font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #hudprogress{font-family:var(--disp); font-weight:700; background:#141929; border:1px solid var(--line);
    padding:3px 11px; border-radius:11px; color:var(--gold); font-size:13px; white-space:nowrap;}
  #canvaswrap{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:10px;}
  canvas{touch-action:none; border-radius:16px; max-width:100%; max-height:100%;
    box-shadow:0 12px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);}
  /* ---- Buttons ---- */
  .btn{
    display:block; width:100%; padding:13px; border:none; border-radius:14px; font-size:15px;
    font-weight:800; cursor:pointer; margin-top:11px; color:var(--ink);
    background:linear-gradient(180deg,#ffe08a,var(--gold) 50%,#f0a93a);
    font-family:var(--disp); letter-spacing:.3px;
    box-shadow:0 4px 0 #8f6114, 0 6px 14px rgba(0,0,0,.3);
  }
  .btn.secondary{background:linear-gradient(180deg,#333c5e,#252c45); color:var(--text); box-shadow:0 4px 0 #14192a;}
  .btn.green{background:linear-gradient(180deg,#8aefae,var(--green) 50%,#3cbf6d); box-shadow:0 4px 0 #1e6a3d, 0 6px 14px rgba(0,0,0,.3);}
  .btn.red{background:linear-gradient(180deg,#ff8f8f,var(--red) 50%,#d84b4b); color:#fff; box-shadow:0 4px 0 #8f2b2b, 0 6px 14px rgba(0,0,0,.3);}
  .btn.blue{background:linear-gradient(180deg,#8ccaff,var(--blue) 50%,#3d8fd6); box-shadow:0 4px 0 #23578a, 0 6px 14px rgba(0,0,0,.3);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  /* ---- Modal ---- */
  #modal-root{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,13,.78); z-index:50; padding:24px;
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  }
  #modal-root.open{display:flex;}
  .modal{
    background:linear-gradient(180deg,#222945,#1a2036); border:1px solid #3a4470; border-radius:22px; padding:22px;
    width:100%; max-width:340px; max-height:82vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    animation:modalin .22s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes modalin{from{transform:scale(.9); opacity:0;}to{transform:scale(1); opacity:1;}}
  .modal h3{font-size:20px; margin-bottom:8px; text-align:center; font-family:var(--disp); letter-spacing:.3px;}
  .modal .body{color:var(--dim); font-size:13.5px; text-align:center; line-height:1.5;}
  .modal .big{font-size:34px; text-align:center; margin:10px 0;}
  /* ---- Slot window (wheel reveal — the signature moment) ---- */
  .slotwin{
    position:relative; margin:14px 0; background:#0f1326; border:2px solid #38406a; border-radius:16px;
    padding:18px 10px; overflow:hidden;
    box-shadow:inset 0 10px 20px rgba(0,0,0,.55), inset 0 -10px 20px rgba(0,0,0,.55), 0 0 0 4px rgba(255,207,92,.06);
  }
  .slotwin::before,.slotwin::after{content:""; position:absolute; left:0; right:0; height:14px; pointer-events:none; z-index:2;}
  .slotwin::before{top:0; background:linear-gradient(180deg,rgba(8,10,20,.9),transparent);}
  .slotwin::after{bottom:0; background:linear-gradient(0deg,rgba(8,10,20,.9),transparent);}
  .slotwin .slotpointer{
    position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:3;
    border-left:8px solid transparent; border-right:8px solid transparent; border-top:9px solid var(--gold);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .rollname{
    text-align:center; font-size:22px; font-weight:800; margin:0; min-height:30px;
    color:var(--gold); font-family:var(--disp);
    text-shadow:0 0 18px rgba(255,207,92,.35);
  }
  .rollname.spinning{color:#cdd4ee; opacity:.8; filter:blur(.6px); text-shadow:none;}
  @media (prefers-reduced-motion: no-preference){
    .rollname.revealed{animation:reveal .5s cubic-bezier(.2,1.7,.4,1);}
    @keyframes reveal{0%{transform:scale(.5)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
  }
  /* ---- Goal banner ---- */
  #goalbanner{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:70; pointer-events:none; transition:opacity .4s;}
  #goalbanner .gb-burst{position:absolute; width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,207,92,.38), transparent 65%); opacity:.8;}
  #goalbanner .gb-txt{
    font-family:var(--disp); font-size:37px; font-weight:900; letter-spacing:1px; text-align:center;
    background:linear-gradient(180deg,#fff3cd 20%,var(--gold) 55%,var(--gold2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));
  }
  #goalbanner .gb-sub{color:#fff; font-size:13px; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.6); margin-top:4px;}
  @media (prefers-reduced-motion: no-preference){
    #goalbanner .gb-txt{animation:gbin .8s cubic-bezier(.2,1.7,.4,1);}
    #goalbanner .gb-burst{animation:gburst .9s ease-out forwards;}
    @keyframes gbin{0%{transform:scale(.2) rotate(-8deg); opacity:0}60%{transform:scale(1.14) rotate(2deg); opacity:1}100%{transform:scale(1)}}
    @keyframes gburst{0%{transform:scale(.2); opacity:0}40%{opacity:.9}100%{transform:scale(1.6); opacity:0}}
  }
  /* ---- 7-day gift calendar ---- */
  .cal7{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:12px;}
  .cal-d{background:#141929; border:1px solid var(--line); border-radius:12px; padding:7px 2px 8px; text-align:center;}
  .cal-d small{display:block; font-size:9px; color:var(--dim); font-weight:700; letter-spacing:.4px;}
  .cal-d .cal-i{display:flex; justify-content:center; margin-top:4px;}
  .cal-d.past{opacity:.45;}
  .cal-d.today{border-color:var(--gold); background:linear-gradient(180deg,#57431c,#2c2410); box-shadow:0 0 14px rgba(255,207,92,.3);}
  .cal-d.today b{display:block; font-size:8px; color:var(--gold); letter-spacing:.6px;}
  .cal-d.d7{background:linear-gradient(180deg,#5b471d,#33270e); border-color:#c8891f;}
  .cal-d.d7 small{color:var(--gold);}
  /* ---- Celebration bits ---- */
  @media (prefers-reduced-motion: no-preference){
    .chestpop{animation:chestpop .7s cubic-bezier(.2,1.8,.4,1);}
    @keyframes chestpop{0%{transform:scale(.2) rotate(-15deg)}55%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1)}}
    .chestwig{animation:chestwig 1.3s infinite;}
    @keyframes chestwig{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
  }
  .shopitem{
    display:flex; align-items:center; gap:10px; background:#232a45; border:1px solid var(--line); border-radius:13px;
    padding:10px 12px; margin-top:8px;
  }
  .shopitem .si-info{flex:1; font-size:13px;}
  .shopitem .si-info small{color:var(--dim); display:block; font-size:11px;}
  .shopitem button{
    border:none; border-radius:10px; padding:8px 12px; font-weight:800; cursor:pointer;
    background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#f0a93a); color:var(--ink); white-space:nowrap;
    font-family:var(--disp); font-size:12px; box-shadow:0 3px 0 #8f6114;
  }
  .shopitem button:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 #8f6114;}
  .shopitem button:disabled{opacity:.4;}
  .lb-row{display:flex; gap:10px; padding:8px 10px; border-radius:10px; font-size:13.5px; align-items:center;}
  .lb-row.me{background:linear-gradient(180deg,#57431c,#3a3320); color:var(--gold); font-weight:700; border:1px solid #6b5426;}
  .lb-row .rank{width:26px; color:var(--dim); font-weight:700; font-family:var(--disp);}
  .lb-row .name{flex:1;}
  .adbox{
    background:#05070e; border:1px solid var(--line); border-radius:12px; height:150px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; margin:12px 0; color:#888; font-size:13px; gap:8px;
  }
  .adbox .adspin{font-size:30px;}
  @media (prefers-reduced-motion: no-preference){
    .adbox .adspin{animation:spin 1.2s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  }
  .note{font-size:10.5px; color:#6b7391; text-align:center; margin-top:10px; flex:0 0 auto;}
  @media (max-height:700px){
    .wm-t{width:36px; height:40px; font-size:22px;}
    .wordmark{margin:4px 0 6px; gap:4px;}
    .tagline{margin-bottom:8px;}
    .mapswatch{width:44px; height:44px;}
    .mapcard{gap:11px; border-radius:15px; padding:8px 14px;}

/* ---------------- Modal helper ---------------- */
const modalRoot = $("modal-root");
function modal(opts){
  // opts: {title, bodyHTML, buttons:[{label, cls, fn, close(default true), disabled}], dismissable}
  modalRoot.innerHTML = "";
  const m = document.createElement("div"); m.className = "modal";
  if(opts.title){ const h = document.createElement("h3"); h.innerHTML = opts.title; m.appendChild(h); }
  if(opts.bodyHTML){ const b = document.createElement("div"); b.innerHTML = opts.bodyHTML; m.appendChild(b); }
  (opts.buttons||[]).forEach(bt=>{
    const btn = document.createElement("button");
    btn.className = "btn " + (bt.cls||""); btn.innerHTML = bt.label;
    if(bt.disabled) btn.disabled = true;
    btn.onclick = ()=>{ if(bt.close!==false) closeModal(); if(bt.fn) bt.fn(); };
    m.appendChild(btn);
  });
  modalRoot.appendChild(m);
  modalRoot.classList.add("open");
  // scroll hint: when a popup overflows, show a bouncing chevron until the
  // player reaches the bottom (bug report #8)
  setTimeout(()=>{
    if(m.scrollHeight > m.clientHeight + 8){
      const hint = document.createElement("div");
      hint.className = "scrollhint";
      hint.textContent = "⌄";
      m.appendChild(hint);
      const upd = ()=>{
        hint.style.opacity = (m.scrollTop + m.clientHeight >= m.scrollHeight - 16) ? "0" : "1";
      };
      m.addEventListener("scroll", upd);
      upd();
    }
  }, 30);
  return m;
}
function closeModal(){ modalRoot.classList.remove("open"); modalRoot.innerHTML=""; }

/* ---------------- Difficulty (GDD §3 — sawtooth, breather every 5th, final at 25) - */
function diff(map, lvl){
  let d = 0.30 + 0.62 * (lvl-1)/24;   // high floor: level 1 already has bite
  if(lvl % 5 === 0 && lvl !== 25) d -= 0.10;          // breather
  if(lvl === 25) d = 1.05;                             // final spike
  d += map * 0.06;                                     // later maps a bit harder
  return Math.max(0.05, Math.min(d, 1.3));
}
const lerp = (a,b,t)=>a+(b-a)*Math.min(1,Math.max(0,t));

function levelParams(mech, map, lvl, assist=0){
  const d = Math.max(0.05, diff(map,lvl) - assist), final = lvl===25;
  switch(mech){
    case "flyer": return {d, final,
      count: 5 + Math.round(7*d),
      gap: lerp(150, 86, d),
      speed: lerp(175, 265, d),
      grav: lerp(1050, 1500, d),
      flap: -lerp(345, 405, d),
      moving: final };
    case "match3": return {d, final,
      colors: 5 + (d>0.5?1:0) + (d>0.85?1:0),
      time: Math.round(lerp(80, 48, d)) - (final?5:0),   // timer replaces move limit
      target: Math.round(lerp(22, 48, d)),
      blockers: final ? 5 : 0 };
    case "dodger": return {d, final,
      time: Math.round(15 + 18*d),
      speed: lerp(340, 540, d),
      spawn: lerp(0.62, 0.34, d),
      doubles: d > 0.35, final };
    case "stack": return {d, final,
      height: 7 + Math.round(7*d),
      speed: lerp(195, 350, d),
      width: lerp(150, 105, d),
      moving: final };
    case "merge": {
      // every level now has a move budget — real pressure instead of a sandbox
      const e = 5 + (d>0.55?1:0) + (final?1:0);   // target 32 / 64 / 128 (final)
      return {d, final,
        target: Math.pow(2, e),
        spawnN: 1,
        moves: 20 + (e-5)*13 + (final?8:0) };
    }
    case "bubble": return {d, final,
      colors: 4 + (d>0.5?1:0) + (d>0.9?1:0),
      rows: 5 + Math.round(3*d),
      shots: Math.round(lerp(18, 26, d)),
      target: Math.round(lerp(24, 50, d)),
      descendEvery: final ? 6 : (d>0.85 ? 9 : 0) };
    case "hopper": return {d, final,
      gap: lerp(72, 104, d),
      pw: lerp(64, 46, d),
      breakFrac: lerp(0.08, 0.35, d),
      moveFrac: d>0.55 ? 0.25 : 0,
      target: Math.round(lerp(1100, 2300, d)) };
    case "runner": return {d, final,
      speed: lerp(285, 415, d),
      interval: lerp(0.98, 0.58, d),
      time: Math.round(16 + 18*d),
      doubles: d>0.35, triples: d>0.7,
      blocks: d>0.3, airsaws: d>0.55 };
    case "ninja": return {d, final,
      climb: lerp(195, 290, d),                 // blistering world scroll
      spikeGap: lerp(350, 240, d),              // scaled with speed to keep reaction time
      target: Math.round(lerp(1900, 3400, d)),
      crawlers: d>0.35, birds: d>0.5, shurikens: d>0.6 };
    case "swing": return {d, final,
      grav: lerp(400, 700, d),
      spacing: lerp(170, 215, d),
      pins: 8 + Math.round(6*d),
      margin: lerp(40, 62, d),
      moving: final };
  }
}

/* ---------------- Controlled-random roll (GDD §5/§6) ---------------- */
function rollMechanic(excludeId){
  // hard-exclude the last TWO mechanics actually played (win or fail),
  // plus an optional explicit exclusion (Roll Again must not repeat the rolled game),
  // and pity-boost mechanics not seen recently
  const played = S.mechHistory.slice(-2);
  const recent = S.mechHistory.slice(-6);
  const pool = [];
  MECHS.forEach(m=>{
    if(played.includes(m.id) || m.id === excludeId) return;
    const w = recent.includes(m.id) ? 1 : 3;
    for(let i=0;i<w;i++) pool.push(m.id);
  });
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return MECHS.find(m=>m.id===pick);
}
function recordPlayed(id){
  // called when a game actually starts — covers rolls AND choice-token picks
  S.lastMech = id;
  S.mechHistory.push(id); if(S.mechHistory.length>12) S.mechHistory.shift();
  save();
}

/* ---------------- FX layer — "juice" (GDC: Juice it or Lose it) ---------------- */
const FX = {
  parts:[], floats:[], shake:0,
  reset(){ this.parts=[]; this.floats=[]; this.shake=0; },
  burst(x,y,color,n=14,sp=190){
    for(let i=0;i<n;i++){
      const a = Math.random()*6.283, v = sp*(0.35+Math.random()*0.8);
      this.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.5+Math.random()*0.35,max:0.85,color,r:2+Math.random()*3.2});
    }
  },
  float(x,y,text,color="#fff"){ this.floats.push({x,y,t:1,text,color}); },
  kick(mag){ if(S.shake) this.shake = Math.max(this.shake, mag); },
  update(dt){
    this.parts = this.parts.filter(p=>{
      p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt;
      return p.life > 0;
    });
    this.floats = this.floats.filter(f=>{ f.t -= dt*1.1; f.y -= 46*dt; return f.t > 0; });
    this.shake *= Math.max(0, 1 - 7*dt); if(this.shake < 0.3) this.shake = 0;
  },
  draw(ctx){
    for(const p of this.parts){
      ctx.globalAlpha = Math.min(1, p.life/p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for(const f of this.floats){
      ctx.globalAlpha = Math.min(1, f.t*1.6);
      ctx.fillStyle = f.color; ctx.font = "bold 19px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  },
};

/* ---------------- SFX — tiny synthesized Web-Audio kit ---------------- */
const Sfx = {
  ac:null,
  ensure(){
    if(!S.sound) return null;
    if(!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(this.ac.state === "suspended") this.ac.resume();
    return this.ac;
  },
  tone(freq, dur, type="sine", vol=0.12, slideTo=0, when=0){
    const ac = this.ensure(); if(!ac) return;
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  },
  play(name){
    if(!S.sound) return;
    switch(name){
      case "tap":     this.tone(420, 0.06, "square", 0.06); break;
      case "flap":    this.tone(330, 0.09, "triangle", 0.09, 520); break;
      case "pass":    this.tone(660, 0.08, "triangle", 0.1); this.tone(990, 0.1, "triangle", 0.09, 0, 0.07); break;
      case "pop":     this.tone(520+Math.random()*260, 0.09, "triangle", 0.1, 180); break;
      case "merge":   this.tone(300, 0.14, "sine", 0.12, 640); break;
      case "drop":    this.tone(240, 0.08, "square", 0.08, 140); break;
      case "perfect": this.tone(880, 0.1, "triangle", 0.11); this.tone(1320, 0.14, "triangle", 0.1, 0, 0.08); break;
      case "fail":    this.tone(190, 0.35, "sawtooth", 0.12, 70); break;
      case "coin":    this.tone(990, 0.06, "square", 0.07); this.tone(1320, 0.09, "square", 0.06, 0, 0.06); break;
      case "win":     [523,659,784,1047].forEach((f,i)=>this.tone(f, 0.16, "triangle", 0.11, 0, i*0.09)); break;
      case "daily":   [392,523,659].forEach((f,i)=>this.tone(f, 0.14, "triangle", 0.1, 0, i*0.08)); break;
    }
  },
};
// browsers require a user gesture before audio — unlock on first interaction
document.addEventListener("pointerdown", ()=>Sfx.ensure(), {once:false});

/* confetti overlay for level-complete celebration */
function confetti(){
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden;";
  const colors = ["#ffcf5c","#5ee08a","#5cb2ff","#ff6b6b","#b48cff","#ff9ff3"];
  for(let i=0;i<44;i++){
    const c = document.createElement("div");
    const sz = 6+Math.random()*7;
    c.style.cssText = `position:absolute;width:${sz}px;height:${sz*0.6}px;border-radius:${Math.random()<0.35?"50%":"2px"};`+
      `background:${colors[i%colors.length]};left:${Math.random()*100}%;top:-12px;`+
      `transform:rotate(${Math.random()*360}deg);`+
      `transition:top ${1.1+Math.random()*0.9}s ease-in, transform 1.6s linear, opacity 1.8s;`;
    wrap.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.top = (60+Math.random()*45)+"%";
      c.style.transform = `rotate(${360+Math.random()*720}deg)`;
      c.style.opacity = "0";
    }));
  }
  document.getElementById("app").appendChild(wrap);
  setTimeout(()=>wrap.remove(), 2100);
}

const Host = {
  game:null, raf:0, lastTs:0, running:false,
  map:0, level:1, mech:null, params:null, adContinueUsed:false,

  startLevel(map, level){
    refreshTop();
    // a quit run from THIS session can be resumed at the exact spot
    if(this._paused && this._paused.map===map && this._paused.level===level){
      this.resumeModal(); return;
    }
    if(S.lives <= 0 && !S.testMode){ livesModal(); return; }
    this.map = map; this.level = level; this.adContinueUsed = false;
    // an already-decided wheel (incl. after an app restart) sticks — no re-spin
    const pend = S.pendingRoll;
    if(pend && pend.m===map && pend.l===level){
      const mech = MECHS.find(x=>x.id===pend.id);
      if(mech){ this.mech = mech; this.setParams(); this.showIntro(false); return; }
    }
    this.rollAndIntro();
  },

  setParams(){
    // comfort assist (flow/DDA research): ease effective difficulty 5% per
    // consecutive give-up on this level, capped at 15%; resets on a win
    const assist = Math.min(0.15, 0.05*(S.fails[this.map+"-"+this.level]||0));
    this.params = levelParams(this.mech.id, this.map, this.level, assist);
  },

  rollAndIntro(){
    this.mech = rollMechanic();
    S.pendingRoll = {m:this.map, l:this.level, id:this.mech.id}; save();
    this.setParams();
    this.showIntro(true);
  },

  reroll(){
    if(!S.testMode) S.rerolls--;
    this.mech = rollMechanic(this.mech.id);   // the rolled game must not repeat
    S.pendingRoll = {m:this.map, l:this.level, id:this.mech.id}; save();
    Sfx.play("tap");
    this.setParams();
    this.showIntro(true);
  },

  showIntro(spin){
    const chosen = this.mech;
    const buttons = [];
    // always visible so players learn these options exist (bug report #7);
    // at ×0 they lead to the shop instead of hiding
    const haveRerolls = S.rerolls > 0 || S.testMode;
    buttons.push({label:`${ic("dice",16)} Roll Again <small>(×${S.testMode?"∞":S.rerolls})</small>`, cls:"secondary",
      fn: haveRerolls ? ()=>this.reroll()
                      : ()=>{ toast(`${ic("dice",14)} Out of Roll Agains — get a set in the shop!`); shopModal(); },
      disabled:spin});
    const havePicks = S.picks > 0 || S.testMode;
    buttons.push({label:`${ic("target",16)} Choose game <small>(×${S.testMode?"∞":S.picks})</small>`, cls:"blue",
      fn: havePicks ? ()=>this.pickerModal()
                    : ()=>{ toast(`${ic("target",14)} Out of choice tokens — get a set in the shop!`); shopModal(); },
      disabled:spin});
    buttons.push({label:"PLAY", cls:"green", fn:()=>this.begin(), disabled:spin});
    const m = modal({title:`Zone ${this.map+1} — Level ${this.level}${this.level===25?" "+ic("crown",18):""}`,
      bodyHTML:`<div class="body">The wheel decides what you play…</div>
        <div class="slotwin"><div class="slotpointer"></div><div class="rollname" id="rollname">?</div></div>
        <div class="body" id="rollobj"></div>`,
      buttons});
    const nameEl = document.getElementById("rollname"), objEl = document.getElementById("rollobj");
    if(!spin){
      nameEl.innerHTML = mbadge(chosen.id,26) + " " + chosen.name;
      objEl.textContent = chosen.obj;
      return;
    }
    // slot-machine style reveal
    nameEl.classList.add("spinning");
    let i = 0, spins = 0;
    const iv = setInterval(()=>{
      nameEl.innerHTML = mbadge(MECHS[i%MECHS.length].id,26) + " " + MECHS[i%MECHS.length].name;
      i++; spins++;
      if(spins > 10){
        clearInterval(iv);
        nameEl.classList.remove("spinning"); nameEl.classList.add("revealed");
        Sfx.play("perfect");
        nameEl.innerHTML = mbadge(chosen.id,26) + " " + chosen.name;
        objEl.textContent = chosen.obj;
        m.querySelectorAll(".btn").forEach(b=>b.disabled = false);
      }
    }, 90);
  },

  pickerModal(){
    const m = modal({title:ic("target",18)+" Choose your game", bodyHTML:
      `<div class="body">Spend 1 choice token (${S.picks} left) to pick this attempt's game.</div>
       <div id="mechgrid">${MECHS.map((mm,i)=>
         `<button class="mp" data-i="${i}">${mbadge(mm.id,26)}<span>${mm.name}</span></button>`).join("")}</div>`,
      buttons:[{label:"Cancel — keep the roll", cls:"secondary", fn:()=>this.showIntro(false)}]});
    m.querySelectorAll(".mp").forEach(b=>b.onclick = ()=>{
      if(!S.testMode) S.picks--;
      this.mech = MECHS[+b.dataset.i];
      // begin() records the pick via recordPlayed() — the next roll excludes it
      save(); refreshTop();
      Sfx.play("coin");
      this.setParams();
      closeModal();
      this.begin();
    });
  },

  runLoop(){
    this.running = true; this.lastTs = 0;
    cancelAnimationFrame(this.raf);
    const loop = (ts)=>{
      if(!this.running) return;
      if(!this.lastTs) this.lastTs = ts;
      const dt = Math.min(0.05, (ts - this.lastTs)/1000);
      this.lastTs = ts;
      // bonus play ends automatically once the bonus-coin cap is reached —
      // otherwise a good player can grind forever for nothing (bug #9)
      if(this.freeplay){
        const capSecs = Math.max(6, this.result ? this.result.coins : 10);
        if((Date.now() - this.freeplayT0)/1000 >= capSecs){
          this.stop(); this.endFreeplay(); return;
        }
      }
      this.game.update(dt);
      FX.update(dt);
      ctx.save();
      if(FX.shake > 0){
        ctx.translate((Math.random()-0.5)*FX.shake, (Math.random()-0.5)*FX.shake);
      }
      this.game.draw(ctx);
      FX.draw(ctx);
      ctx.restore();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  begin(){
    showScreen("screen-game");
    const theme = THEMES[this.map];
    const cls = {flyer:Flyer, match3:Match3, dodger:Dodger, stack:StackTap, merge:MergeRoll,
                 bubble:Bubble, hopper:Hopper, runner:Runner, ninja:Ninja, swing:Swing}[this.mech.id];
    FX.reset();
    this.freeplay = false; this.result = null;
    this._paused = null; S.pendingRoll = null;   // the decided wheel is being consumed
    recordPlayed(this.mech.id);
    this.game = new cls(this, this.params, theme);
    $("hudobjective").innerHTML = mbadge(this.mech.id,20) + " " + this.mech.name;
    // funnel telemetry (per-level attempts, GameAnalytics/Candy Crush practice)
    const key = this.map+"-"+this.level;
    const st = S.stats[key] || (S.stats[key] = {a:0,w:0});
    st.a++; save();
    this.runLoop();
  },

  setProgress(txt){ $("hudprogress").textContent = txt; },

  stop(){ this.running = false; cancelAnimationFrame(this.raf); },

  /* ---- fail flow (GDD §6): continue item resumes SAME attempt; retry re-rolls ---- */
  endFreeplay(){
    // bonus run over → the level-complete screen (rewards were banked at the goal)
    this.freeplay = false;
    const r = this.result || {coins:0, uniqueGain:false, mapDone:false, final:this.level===25};
    const secs = Math.max(0, (Date.now() - this.freeplayT0)/1000);
    // bonus caps at half the level's coin reward
    const bonus = Math.min(Math.max(1, Math.ceil(r.coins/2)), Math.max(2, Math.round(secs/2)));
    S.coins += bonus; save(); refreshTop(); Sfx.play("coin");
    const next = this.level < 25 ? this.level+1 : null;
    // UX order: core loop first, monetization second, exit last
    const buttons = [];
    if(next) buttons.push({label:"Next level "+ic("play",13), cls:"green", fn:()=>{ this.maybeAdThen(()=>this.startLevel(this.map, next)); }});
    buttons.push({label:`${ic("tv",15)} Double coins (+${r.coins})`, cls:"secondary", fn:()=>{
      rewardedAd(`+${r.coins} bonus coins!`, ()=>{ S.coins += r.coins; save(); refreshTop(); Sfx.play("coin"); this.afterResult(next, r.mapDone); });
    }});
    buttons.push({label:"Back to map", cls:"secondary", fn:()=>{ this.maybeAdThen(()=>this.afterResult(null, r.mapDone)); }});
    modal({title: r.final ? ic("crown",18)+" FINAL LEVEL CLEARED!" : "Level Complete!", bodyHTML:
      `<div class="big">${ic("coin",26)} +${r.coins} <small style="font-size:15px;color:var(--green)">+${bonus} bonus</small></div>
       <div class="body">Bonus run: <b>${Math.round(secs)}s</b> past the goal — no life lost.</div>
       ${r.breatherCoins ? `<div class="body">${ic("leaf",13)} Breather treat — <b>+${r.breatherCoins} bonus coins</b>${r.chestGain ? ` and a <b>${ic("gift",13)} Gift Chest</b>! Open it from the top bar.` : `!`}</div>`:""}
       ${r.uniqueGain ? `<div class="body">${ic("star",13)} Unique level cleared — <b>+1 free Continue item!</b></div>`:""}
       ${r.mapDone ? `<div class="body">${ic("crown",13)} <b>Zone ${this.map+1} complete!</b><br>+250 coins · +2 continues · +3 lives · +1 ${ic("dice",13)} Roll Again · new zone & cosmetic pack unlocked!</div>`:""}`,
      buttons});
  },

  fail(){
    if(!this.running) return;
    FX.kick(16); Sfx.play("fail");
    this.stop();
    if(this.freeplay){ this.endFreeplay(); return; }   // bonus play: no life, no continue flow
    // near-miss framing (reward-psychology research): show how close the attempt got
    const prog = Math.round(Math.max(0, Math.min(1, this.game.progress ? this.game.progress() : 0))*100);
    const buttons = [];
    if(S.continues > 0 || S.testMode){
      buttons.push({label:`${ic("rewind",15)} Use Continue <small>(${S.testMode?"∞":S.continues+" left"})</small>`, cls:"green", fn:()=>{
        if(!S.testMode){ S.continues--; }
        S.continuesUsed++; save(); refreshTop();
        this.revive();
      }});
    } else if(!this.adContinueUsed){
      buttons.push({label:ic("tv",15)+" Watch ad → free continue", cls:"blue", fn:()=>{
        this.adContinueUsed = true; S.continuesUsed++; save();
        rewardedAd("Continue granted — same attempt, same mechanic.", ()=>this.revive());
      }});
    }
    buttons.push({label:ic("heartbroken",15)+" Give up (−1 life, re-rolls mechanic)", cls:"red", fn:()=>{
      if(!S.testMode) S.lives = Math.max(0, S.lives-1);
      const key = this.map+"-"+this.level;
      S.fails[key] = (S.fails[key]||0) + 1;   // feeds the comfort assist
      save(); refreshTop();
      maybeInterstitial(()=> openLevels(this.map));
    }});
    modal({title:"Ouch — attempt failed!", bodyHTML:
      `<div style="display:flex;justify-content:center;margin:10px 0">${mbadge(this.mech.id,54)}</div>
       ${prog>0?`<div class="body">You were <b>${prog}%</b> of the way there!</div>
       <div class="progressbar" style="margin:10px 20px"><i style="width:${prog}%"></i></div>`:""}
       <div class="body">A continue rewinds this <b>same attempt</b> — retrying instead costs a life and re-rolls the mechanic.</div>`,
      buttons});
  },

  revive(){
    this.game.revive();
    this.runLoop();
  },

  /* ---- win flow (GDD §5/§9): coins, unique-level item, map completion, ad pacing - */
  win(){
    if(!this.running) return;
    if(this.freeplay) return;   // goal already banked — bonus play ignores win signals
    // bank the rewards immediately — the game does NOT stop
    const d = this.params.d, final = this.level === 25;
    const coins = 10 + Math.round(22*d) + (final?30:0);
    // strictly sequential: a level only advances progress if the previous one is done —
    // so the next map unlocks ONLY after the final level is truly reached and cleared
    // (jumping ahead in tester mode can't skip the chain)
    const firstClear = S.prog[this.map] === this.level - 1;
    const key = this.map + "-" + this.level;
    S.fails[key] = 0;                                      // reset comfort assist
    const st = S.stats[key] || (S.stats[key] = {a:1,w:0}); // funnel telemetry
    st.w++;
    let uniqueGain = false;
    if(UNIQUE_LEVELS.includes(this.level) && !S.uniques[key]){
      S.uniques[key] = true; S.continues++; uniqueGain = true;
    }
    // breather treat: +10 coins every clear; a gift chest on the first clear
    const breather = this.level % 5 === 0 && this.level !== 25;
    let breatherCoins = 0, chestGain = false;
    if(breather){
      breatherCoins = 10; S.coins += 10;
      if(firstClear){ S.chests += 1; chestGain = true; }
    }
    if(firstClear) S.prog[this.map] = this.level;
    S.coins += coins;
    S.completions++;
    const mapDone = final && firstClear;
    if(mapDone){
      S.coins += 250; S.continues += 2; S.lives += 3; S.rerolls += 1;
      if(!S.cosmetics.includes(this.map+1) && this.map+1 < 5) S.cosmetics.push(this.map+1);
    }
    save(); refreshTop();
    this.result = {coins, uniqueGain, mapDone, final, breatherCoins, chestGain};
    // announce and roll straight into bonus play with a 5-second shield
    Sfx.play("win"); confetti();
    goalBanner("GOAL ACHIEVED!", "keep playing for bonus coins");
    this.freeplay = true;
    this.freeplayT0 = Date.now();
    if("inv" in this.game) this.game.inv = 5;
    if(this.game.updateHud) this.game.updateHud();   // e.g. Bubble's shots → ∞
  },
  maybeAdThen(fn){
    if(S.completions % 3 === 0) maybeInterstitial(fn); else fn();
  },
  afterResult(next, mapDone){
    if(next !== null && next !== undefined) { this.startLevel(this.map, next); return; }
    if(mapDone && this.map < 4){ renderHome(); showScreen("screen-home"); }
    else openLevels(this.map);
  },

  quit(){
    this.stop();
    if(this.freeplay){ this.endFreeplay(); return; }   // goal already achieved → results
    modal({title:"Quit level?", buttons:[
      {label:"Keep playing", cls:"green", fn:()=>this.runLoop()},
      {label:"Quit", cls:"red", fn:()=>{
        // park the run — resumable from the level icon; wheel decision persists
        this._paused = {map:this.map, level:this.level, mech:this.mech, params:this.params, game:this.game};
        S.pendingRoll = {m:this.map, l:this.level, id:this.mech.id}; save();
        openLevels(this.map);
      }},
    ]});
  },

  resumeModal(){
    const p = this._paused;
    modal({title:"You quit mid-run", bodyHTML:
      `<div style="display:flex;justify-content:center;margin:10px 0">${mbadge(p.mech.id,54)}</div>
       <div class="body">Resume <b>${p.mech.name}</b> from the same spot with a <b>5-second shield</b> —
       or return to the map, which costs <b>1 life</b>.</div>`,
      buttons:[
        {label:ic("shield",15)+" Resume (5s shield)", cls:"green", fn:()=>{
          this.map=p.map; this.level=p.level; this.mech=p.mech; this.params=p.params; this.game=p.game;
          this._paused=null; S.pendingRoll=null; save();
          $("hudobjective").innerHTML = mbadge(this.mech.id,20) + " " + this.mech.name;
          showScreen("screen-game");
          if("inv" in this.game) this.game.inv = 5;
          toast(ic("shield",14)+" 5s shield — back in!");
          this.runLoop();
        }},
        {label:ic("map",15)+" Return to the map (−1 life)", cls:"red", fn:()=>{
          if(!S.testMode) S.lives = Math.max(0, S.lives-1);
          this._paused=null; S.pendingRoll=null; save(); refreshTop();
        }},
      ]});
  },
};

/* ---------------- Canvas input plumbing ---------------- */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (W/r.width), y:(e.clientY - r.top) * (H/r.height) };
}
cv.addEventListener("contextmenu", e=>e.preventDefault());   // no long-press menu mid-game
cv.addEventListener("pointerdown", e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId);
  if(Host.running && Host.game && Host.game.onDown) Host.game.onDown(canvasPos(e)); });
cv.addEventListener("pointermove", e=>{ if(Host.running && Host.game && Host.game.onMove) Host.game.onMove(canvasPos(e)); });
cv.addEventListener("pointerup",   e=>{ if(Host.running && Host.game && Host.game.onUp)   Host.game.onUp(canvasPos(e)); });
document.addEventListener("keydown", e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp"," ","a","d","w"].includes(e.key)) e.preventDefault();
  if(Host.running && Host.game && Host.game.onKey) Host.game.onKey(e.key);
});
$("btn-quit").onclick = ()=>{ if(Host.running) Host.quit(); else openLevels(Host.map); };

/* ---------------- Shared draw helpers ---------------- */
const _bgCache = {};
function _grad(key, c0, c1){
  let g = _bgCache[key];
  if(!g){ g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,c0); g.addColorStop(1,c1); _bgCache[key]=g; }
  return g;
}
const _stars = Array.from({length:34},(_,i)=>({x:(i*97)%W, y:(i*61)%(H*0.62|0), r:(i%3)*0.5+0.9, a:0.10+((i*37)%10)/50}));
const _sky = Array.from({length:20},(_,i)=>({x:(i*93)%(W-30), w:20+((i*53)%32), h:60+((i*71)%150)}));
function _hills(y0, amp, ph, step){
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=step) ctx.lineTo(x, y0 + Math.sin(x*0.013+ph)*amp);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function _peaks(y0, amp, step){
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W+step;x+=step){ const up = ((x/step)|0)%2===0; ctx.lineTo(x, y0 + (up?-amp:amp*0.35)); }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawScape(theme, dark){
  const idx = Math.max(0, THEMES.indexOf(theme));
  if(dark){
    ctx.fillStyle="#fff";
    for(const s of _stars){ ctx.globalAlpha=s.a; ctx.fillRect(s.x,s.y,s.r*2,s.r*2); }
    ctx.globalAlpha=1;
  }
  const a1 = dark? "rgba(255,255,255,.045)" : "rgba(0,0,0,.10)";
  const a2 = dark? "rgba(255,255,255,.07)"  : "rgba(0,0,0,.16)";
  if(idx===0){
    if(!dark){ ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(W-70,74,30,0,6.283); ctx.fill(); }
    ctx.fillStyle=a1; _hills(H-150,26,0,20); ctx.fillStyle=a2; _hills(H-95,20,2.2,20);
  } else if(idx===1){
    if(!dark){ ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(W-80,80,36,0,6.283); ctx.fill(); }
    ctx.fillStyle=a1; _hills(H-140,34,1.1,26); ctx.fillStyle=a2; _hills(H-85,26,3.6,26);
  } else if(idx===2){
    ctx.fillStyle=a1; _peaks(H-160,70,60); ctx.fillStyle=a2; _peaks(H-95,52,44);
  } else if(idx===3){
    ctx.fillStyle=a2;
    for(const b of _sky) ctx.fillRect(b.x, H-40-b.h, b.w, b.h);
    ctx.fillStyle = dark? "rgba(255,225,120,.22)" : "rgba(255,255,255,.35)";
    for(const b of _sky){ for(let k=0;k<3;k++) ctx.fillRect(b.x+4+(k%2)*9, H-52-((b.h*(k+1)/4)|0), 4, 5); }
  } else {
    ctx.fillStyle=a1; _peaks(H-150,64,80);
    ctx.fillStyle=a2;
    ctx.beginPath(); ctx.moveTo(W*0.15,H); ctx.lineTo(W*0.45,H-190); ctx.lineTo(W*0.56,H-190); ctx.lineTo(W*0.86,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,120,60,.5)"; ctx.fillRect(W*0.45,H-194,W*0.11,5);
  }
}
function bgSky(theme){
  ctx.fillStyle = _grad("s"+theme.name, theme.sky[0], theme.sky[1]); ctx.fillRect(0,0,W,H);
  drawScape(theme, false);
}
function bgDark(theme){
  ctx.fillStyle = _grad("d"+theme.name, theme.dark, "#0c0e16"); ctx.fillRect(0,0,W,H);
  drawScape(theme, true);
}
function drawFlag(x, y, s){
  s = s || 1;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle="#3a4260"; rr(-2,-30,4,32,2); ctx.fill();
  ctx.fillStyle="#ffcf5c";
  ctx.beginPath(); ctx.moveTo(2,-30); ctx.lineTo(27,-22.5); ctx.lineTo(2,-15); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(2,-30); ctx.lineTo(27,-22.5); ctx.lineTo(2,-15); ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* =====================================================================
   ENGINE 1 — CHECKPOINT FLYER (tap to ascend through gaps)
   ===================================================================== */
class Flyer{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.y=H/2; this.vy=0; this.r=14; this.px=90;
    this.obs=[]; this.passed=0; this.inv=0; this.time=0; this.started=false;
    const spacing = lerp(260, 210, P.d);
    for(let i=0;i<4;i++) this.addOb(W + 160 + i*spacing);
    this.spacing = spacing;
    host.setProgress(`0 / ${P.count}`);
  }
  addOb(x){
    const gy = 110 + Math.random()*(H-260);
    this.obs.push({x, baseY:gy, gapY:gy, passed:false, ph:Math.random()*6.28});
  }
  flap(){
    this.started = true; this.vy = this.P.flap;
    Sfx.play("flap");
    FX.burst(this.px-12, this.y+10, "#ffffff", 4, 90);
  }
  onDown(){ this.flap(); }
  onKey(k){ if(k===" "||k==="ArrowUp"||k==="w") this.flap(); }
  progress(){ return this.passed / this.P.count; }
  revive(){
    this.inv = 1.6; this.vy = 0;
    this.y = Math.min(Math.max(this.y, 80), H-120);
    this.obs = this.obs.filter(o=>o.x < this.px-40 || o.x > this.px+330);
  }
  update(dt){
    this.time += dt;
    if(!this.started){ this.y = H/2 + Math.sin(this.time*3)*8; return; }
    if(this.inv>0) this.inv -= dt;
    this.vy += this.P.grav*dt; this.y += this.vy*dt;
    // every checkpoint passed nudges the pace up (capped at +25%)
    const sp = this.P.speed * (1 + Math.min(0.25, 0.03*this.passed));
    for(const o of this.obs){
      o.x -= sp*dt;
      if(this.P.moving) o.gapY = o.baseY + Math.sin(this.time*1.6 + o.ph)*42;
    }
    // recycle / spawn
    while(this.obs.length && this.obs[0].x < -60) this.obs.shift();
    // a revive can clear the whole list — reseed or checkpoints never spawn again (bug #10)
    if(!this.obs.length) this.addOb(W + 160);
    const last = this.obs[this.obs.length-1];
    if(last && last.x < W) this.addOb(last.x + this.spacing);
    // pass + collide
    const pw = 30;
    for(const o of this.obs){
      if(!o.passed && o.x + pw/2 < this.px - this.r){
        o.passed = true; this.passed++;
        Sfx.play("pass");
        FX.burst(o.x, o.gapY, "#ffcf5c", 12, 160);
        FX.float(o.x, o.gapY - 30, `${this.passed}/${this.P.count}`, "#ffcf5c");
        this.h.setProgress(`${this.passed} / ${this.P.count}`);
        if(this.passed >= this.P.count && !this.h.freeplay){ this.h.win(); return; }
      }
      if(this.inv<=0 && Math.abs(o.x - this.px) < pw/2 + this.r - 2){
        const half = this.P.gap/2;
        if(this.y - this.r < o.gapY - half || this.y + this.r > o.gapY + half){ this.h.fail(); return; }
      }
    }
    if(this.inv<=0 && (this.y < this.r || this.y > H - 36 - this.r)){ this.h.fail(); return; }
  }
  draw(){
    const t = this.t;
    bgSky(t);
    // ground
    ctx.fillStyle = t.ground; ctx.fillRect(0,H-36,W,36);
    // obstacles: checkpoint pylons with ring gap
    for(const o of this.obs){
      const half = this.P.gap/2, pw = 30;
      ctx.fillStyle = t.accent;
      rr(o.x-pw/2, -10, pw, o.gapY-half+10, 8); ctx.fill();
      rr(o.x-pw/2, o.gapY+half, pw, H-36-(o.gapY+half), 8); ctx.fill();
      // ring highlight
      ctx.strokeStyle = o.passed ? "#5ee08a" : "#ffcf5c"; ctx.lineWidth = 4;
      ctx.strokeRect(o.x-pw/2-4, o.gapY-half, pw+8, this.P.gap);
    }
    // plane
    ctx.save();
    ctx.translate(this.px, this.y);
    ctx.rotate(Math.max(-0.5, Math.min(0.7, this.vy/500)));
    if(this.inv>0 && Math.floor(this.time*10)%2===0) ctx.globalAlpha = 0.4;
    ctx.fillStyle=t.tile[3]; rr(-17,-9,34,18,9); ctx.fill();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=2.5; rr(-17,-9,34,18,9); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.85)"; rr(-14,1,28,7,4); ctx.fill();
    ctx.fillStyle=t.tile[3];
    ctx.beginPath(); ctx.moveTo(-16,-8); ctx.lineTo(-23,-18); ctx.lineTo(-11,-9); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.22)"; rr(-8,-3,15,9,4); ctx.fill();
    ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(6,-3,5,0,6.283); ctx.fill();
    ctx.fillStyle="#10131c"; ctx.beginPath(); ctx.arc(7.5,-3,2.4,0,6.283); ctx.fill();
    ctx.fillStyle="#ffcf5c"; ctx.beginPath(); ctx.arc(17,0,4.5,0,6.283); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.ellipse(20,0,2, 3+9*Math.abs(Math.sin(this.time*22)), 0, 0, 6.283); ctx.fill();
    ctx.restore();
    if(!this.started){
      ctx.fillStyle = "rgba(0,0,0,.45)"; rr(60,H/2+60,W-120,44,10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "16px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("TAP / SPACE to fly", W/2, H/2+87);
    }
  }
}

/* =====================================================================
   ENGINE 2 — MATCH-3 CASCADE
   ===================================================================== */
class Match3{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.N=7; this.cell=48; this.x0=(W-this.N*this.cell)/2; this.y0=110;
    this.time=P.time; this.cleared=0; this._lastT=-1;
    this.state="idle"; this.timer=0; this.anim=null; this.sel=null; this.downCell=null;
    // build board with no starting matches
    this.g = [];
    for(let r=0;r<this.N;r++){ this.g.push([]);
      for(let c=0;c<this.N;c++){
        let v;
        do{ v = Math.floor(Math.random()*P.colors); }
        while((c>=2 && this.g[r][c-1] && this.g[r][c-1].v===v && this.g[r][c-2].v===v) ||
              (r>=2 && this.g[r-1][c].v===v && this.g[r-2][c].v===v));
        this.g[r].push({v, yOff:0, pop:0});
      }
    }
    // blockers (final): immovable stones
    let placed=0, guard=0;
    while(placed < P.blockers && guard++<200){
      const r = 1+Math.floor(Math.random()*(this.N-2)), c = 1+Math.floor(Math.random()*(this.N-2));
      if(this.g[r][c].v !== -2){ this.g[r][c] = {v:-2, yOff:0, pop:0}; placed++; }
    }
    this.updateHud();
    if(!this.hasMove()) this.shuffle();
  }
  updateHud(){ this.h.setProgress(`${this.cleared}/${this.P.target} · ${this.fmtT()}`); }
  fmtT(){ const s=Math.max(0,Math.ceil(this.time)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  cellAt(p){
    const c = Math.floor((p.x-this.x0)/this.cell), r = Math.floor((p.y-this.y0)/this.cell);
    if(r<0||c<0||r>=this.N||c>=this.N) return null; return {r,c};
  }
  onDown(p){ if(this.state!=="idle") return;
    const cc = this.cellAt(p); if(!cc || this.g[cc.r][cc.c].v<0) { this.sel=null; return; }
    if(this.sel && Math.abs(this.sel.r-cc.r)+Math.abs(this.sel.c-cc.c)===1){ this.trySwap(this.sel, cc); this.sel=null; this.downCell=null; return; }
    this.sel = cc; this.downCell = {cell:cc, x:p.x, y:p.y};
  }
  onMove(p){ if(this.state!=="idle" || !this.downCell) return;
    const dx = p.x-this.downCell.x, dy = p.y-this.downCell.y;
    if(Math.abs(dx)<18 && Math.abs(dy)<18) return;
    const from = this.downCell.cell;
    const to = Math.abs(dx)>Math.abs(dy)
      ? {r:from.r, c:from.c + (dx>0?1:-1)} : {r:from.r + (dy>0?1:-1), c:from.c};
    this.downCell = null; this.sel = null;
    if(to.r<0||to.c<0||to.r>=this.N||to.c>=this.N) return;
    this.trySwap(from,to);
  }
  onUp(){ this.downCell = null; }
  trySwap(a,b){
    if(this.g[a.r][a.c].v<0 || this.g[b.r][b.c].v<0) return;
    this.state="swap"; this.anim={a,b,t:0,back:false};
  }
  doSwap(a,b){ const tmp=this.g[a.r][a.c]; this.g[a.r][a.c]=this.g[b.r][b.c]; this.g[b.r][b.c]=tmp; }
  findMatches(){
    const kill = new Set();
    for(let r=0;r<this.N;r++){
      let run=1;
      for(let c=1;c<=this.N;c++){
        const same = c<this.N && this.g[r][c].v>=0 && this.g[r][c].v===this.g[r][c-1].v;
        if(same) run++;
        else{ if(run>=3 && this.g[r][c-1].v>=0) for(let k=c-run;k<c;k++) kill.add(r+","+k); run=1; }
      }
    }
    for(let c=0;c<this.N;c++){
      let run=1;
      for(let r=1;r<=this.N;r++){
        const same = r<this.N && this.g[r][c].v>=0 && this.g[r][c].v===this.g[r-1][c].v;
        if(same) run++;
        else{ if(run>=3 && this.g[r-1][c].v>=0) for(let k=r-run;k<r;k++) kill.add(k+","+c); run=1; }
      }
    }
    return kill;
  }
  hasMove(){
    for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){
      for(const [dr,dc] of [[0,1],[1,0]]){
        const r2=r+dr, c2=c+dc;
        if(r2>=this.N||c2>=this.N) continue;
        if(this.g[r][c].v<0 || this.g[r2][c2].v<0) continue;
        this.doSwap({r,c},{r:r2,c:c2});
        const ok = this.findMatches().size>0;
        this.doSwap({r,c},{r:r2,c:c2});
        if(ok) return true;
      }
    }
    return false;
  }
  shuffle(){
    const vals=[];
    for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++) if(this.g[r][c].v>=0) vals.push(this.g[r][c].v);
    let guard=0;
    do{
      for(let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
      let i=0;
      for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++) if(this.g[r][c].v>=0) this.g[r][c].v=vals[i++];
    }while((this.findMatches().size>0 || !this.hasMove()) && guard++<60);
  }
  revive(){ this.time += 20; this.updateHud(); }   // resumes mid-state; +20s on the clock
  progress(){ return this.cleared / this.P.target; }
  update(dt){
    // countdown runs continuously; fail only lands in a settled state
    this.time -= dt;
    if(Math.ceil(this.time) !== this._lastT){ this._lastT = Math.ceil(this.time); this.updateHud(); }
    if(this.state==="idle" && this.time <= 0){ this.h.fail(); return; }
    if(this.state==="swap"){
      this.anim.t += dt*7;
      if(this.anim.t>=1){
        const {a,b} = this.anim;
        this.doSwap(a,b);
        if(this.anim.back){ this.state="idle"; this.anim=null; return; }
        if(this.findMatches().size){
          this.cascade = 0;
          this.state="resolve"; this.timer=0; this.anim=null;
        } else { this.anim={a,b,t:0,back:true}; }
      }
      return;
    }
    if(this.state==="resolve"){
      // pop matched
      const kill = this.findMatches();
      if(kill.size){
        this.cascade = (this.cascade||0) + 1;
        if(this.cascade >= 2){
          FX.float(W/2, this.y0 - 18, `CASCADE ×${this.cascade}`, "#ffcf5c");
          Sfx.play("pass");
        }
        kill.forEach(k=>{ const [r,c]=k.split(",").map(Number); this.g[r][c].pop=1; });
        this.state="pop"; this.timer=0;
      } else {
        // done cascading → check end
        if(this.cleared >= this.P.target && !this.h.freeplay){ this.h.win(); return; }
        if(this.time <= 0){ this.h.fail(); return; }
        if(!this.hasMove()) this.shuffle();
        this.state="idle";
      }
      return;
    }
    if(this.state==="pop"){
      this.timer += dt;
      let any=false;
      for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){
        const t = this.g[r][c];
        if(t.pop>0){ t.pop -= dt*5;
          if(t.pop<=0){
            FX.burst(this.x0+c*this.cell+this.cell/2, this.y0+r*this.cell+this.cell/2, this.t.tile[t.v], 7, 130);
            Sfx.play("pop");
            t.v=-1; t.pop=0; this.cleared++;
          } else any=true;
        }
      }
      this.updateHud();
      if(!any){
        // collapse & refill
        for(let c=0;c<this.N;c++){
          let write = this.N-1;
          for(let r=this.N-1;r>=0;r--){
            const t = this.g[r][c];
            if(t.v===-2){ write = r-1; continue; }         // blockers don't fall
            if(t.v>=0){
              if(write!==r){ this.g[write][c] = t; t.yOff = -(write-r)*this.cell; this.g[r][c]={v:-1,yOff:0,pop:0}; }
              write--;
            }
          }
          let spawn = 1;
          for(let r=write;r>=0;r--){
            if(this.g[r][c].v===-2) continue;
            this.g[r][c] = {v:Math.floor(Math.random()*this.P.colors), yOff:-(spawn++)*this.cell - 20, pop:0};
          }
        }
        this.state="fall";
      }
      return;
    }
    if(this.state==="fall"){
      let moving=false;
      for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){
        const t=this.g[r][c];
        if(t.yOff<0){ t.yOff += 900*dt; if(t.yOff>0) t.yOff=0; else moving=true; }
      }
      if(!moving) this.state="resolve";
      return;
    }
  }
  draw(){
    bgDark(this.t);
    ctx.fillStyle="rgba(255,255,255,.04)";
    rr(this.x0-8, this.y0-8, this.N*this.cell+16, this.N*this.cell+16, 14); ctx.fill();
    for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){
      const t = this.g[r][c];
      let x = this.x0 + c*this.cell, y = this.y0 + r*this.cell + t.yOff;
      // swap animation offset
      if(this.anim && this.state==="swap"){
        const {a,b,t:at} = this.anim, e = at;
        if(a.r===r && a.c===c){ x += (b.c-a.c)*this.cell*e; y += (b.r-a.r)*this.cell*e; }
        if(b.r===r && b.c===c){ x += (a.c-b.c)*this.cell*e; y += (a.r-b.r)*this.cell*e; }
      }
      if(t.v===-2){
        ctx.fillStyle="#4a4f63"; rr(x+3,y+3,this.cell-6,this.cell-6,8); ctx.fill();
        ctx.fillStyle="#31354a"; rr(x+10,y+10,this.cell-20,this.cell-20,5); ctx.fill();
        continue;
      }
      if(t.v<0) continue;
      const sc = t.pop>0 ? t.pop : 1;
      const s = (this.cell-8)*sc, off = (this.cell-s)/2;
      ctx.fillStyle = this.t.tile[t.v];
      rr(x+off, y+off, s, s, 10); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.28)";
      rr(x+off+4, y+off+4, s-8, s*0.32, 7); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.15)";
      rr(x+off+4, y+off+s-11, s-8, 7, 4); ctx.fill();
      if(S.cbSymbols && sc > 0.55){
        // accessibility: never convey match info by color alone — one symbol per color
        ctx.fillStyle = "rgba(0,0,0,.5)";
        ctx.font = `bold ${Math.round(s*0.42)}px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(Match3.SYMBOLS[t.v], x+this.cell/2, y+this.cell/2+1);
      }
      if(this.sel && this.sel.r===r && this.sel.c===c){
        ctx.strokeStyle="#fff"; ctx.lineWidth=3; rr(x+2,y+2,this.cell-4,this.cell-4,10); ctx.stroke();
      }
    }
    // objective strip
    ctx.fillStyle="rgba(0,0,0,.35)"; rr(50, 34, W-100, 46, 12); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 15px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
    ctx.fillText(`Clear ${this.P.target} tiles`, W/2, 54);
    ctx.fillStyle = this.time < 11 ? "#ff6b6b" : "#ffcf5c"; ctx.font="13px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif";
    ctx.fillText(`${Math.min(this.cleared,this.P.target)} cleared · ⏱ ${this.fmtT()}`, W/2, 72);
  }
}

Match3.SYMBOLS = ["●","▲","■","◆","★","✚","♥"];

/* =====================================================================
   ENGINE 3 — DASH DODGER (bounded 3-lane dodge runner)
   ===================================================================== */
class Dodger{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.lanes=[W/2-105, W/2, W/2+105];
    this.lane=1; this.x=this.lanes[1]; this.py=H-110;
    this.obs=[]; this.timer=0; this.spawnT=0.8; this.inv=0; this.roadOff=0;
    this.swipe=null;
    host.setProgress(`${P.time}s`);
  }
  move(dir){
    const nl = Math.max(0, Math.min(2, this.lane+dir));
    if(nl !== this.lane) Sfx.play("tap");
    this.lane = nl;
  }
  progress(){ return this.timer / this.P.time; }
  onKey(k){ if(k==="ArrowLeft"||k==="a") this.move(-1); if(k==="ArrowRight"||k==="d") this.move(1); }
  onDown(p){ this.swipe = {x:p.x, y:p.y, used:false}; }
  onMove(p){
    if(this.swipe && !this.swipe.used && Math.abs(p.x-this.swipe.x)>28){
      this.move(p.x>this.swipe.x?1:-1); this.swipe.used=true;
    }
  }
  onUp(p){
    if(this.swipe && !this.swipe.used){ this.move(p.x < W/2 ? -1 : 1); }
    this.swipe=null;
  }
  revive(){ this.inv=1.4; this.obs = this.obs.filter(o=>o.y < this.py-260); }
  mkOb(lane, allowShifty){
    const shapes=["rock","cone","barrel","crate"];
    const o={lane, y:-40, shape:shapes[Math.floor(Math.random()*shapes.length)],
             ph:Math.random()*6.28, kind:"n", hopT:0};
    // the surprise block: wobbles, then hops one lane mid-way down
    const shiftyChance = lerp(0.10, 0.25, this.P.d);
    if(allowShifty && Math.random() < shiftyChance){
      o.kind="shifty"; o.shape="shifty";
      o.hopAt = 170 + Math.random()*90;   // hop point — still ≥0.55s before impact
      o.hopped=false;
    }
    return o;
  }
  update(dt){
    this.timer += dt;
    // pressure builds within the run: +25% speed by the end
    const sp = this.P.speed * (1 + 0.25*Math.min(1, this.timer/this.P.time));
    this.roadOff = (this.roadOff + sp*dt) % 60;
    if(this.inv>0) this.inv -= dt;
    const rem = this.P.time - this.timer;
    this.h.setProgress(`${Math.max(0,Math.ceil(rem))}s`);
    if(rem <= 0 && !this.h.freeplay){ this.h.win(); return; }
    // spawn
    this.spawnT -= dt;
    if(this.spawnT <= 0){
      this.spawnT = this.P.spawn * (0.85 + Math.random()*0.4);
      const openLane = Math.floor(Math.random()*3);
      if(this.P.final && Math.random()<0.5){
        for(let l=0;l<3;l++) if(l!==openLane) this.obs.push(this.mkOb(l, false));
      } else if(this.P.doubles && Math.random()<0.35){
        const l2 = (openLane+1+Math.floor(Math.random()*2))%3;
        for(let l=0;l<3;l++) if(l!==openLane && l!==l2) this.obs.push(this.mkOb(l, false));
      } else {
        this.obs.push(this.mkOb((openLane+1+Math.floor(Math.random()*2))%3, true));
      }
    }
    // move & collide
    this.x += (this.lanes[this.lane]-this.x) * Math.min(1, dt*18);
    for(const o of this.obs){
      o.y += sp*dt;
      if(o.hopT > 0) o.hopT = Math.max(0, o.hopT - dt);
      if(o.kind==="shifty" && !o.hopped && o.y >= o.hopAt){
        o.hopped = true;
        const from = o.lane;
        o.lane = o.lane===1 ? (Math.random()<0.5?0:2) : 1;   // hop one lane
        o.hopFrom = this.lanes[from] - this.lanes[o.lane];
        o.hopT = 0.16;
        Sfx.play("drop");
        FX.burst(this.lanes[o.lane], o.y, this.t.tile[4], 6, 110);
      }
      if(!o.dodged && o.y > this.py + 40){   // near-dodge feedback
        o.dodged = true;
        if(o.lane !== this.lane) FX.burst(this.lanes[o.lane], o.y, "rgba(255,255,255,.7)", 3, 70);
      }
    }
    this.obs = this.obs.filter(o=>o.y < H+60);
    if(this.inv<=0){
      for(const o of this.obs){
        if(o.lane===this.lane && Math.abs(o.y - this.py) < 42){ this.h.fail(); return; }
      }
    }
  }
  drawOb(o){
    const t=this.t;
    const ox = this.lanes[o.lane] + (o.hopT>0 && o.hopFrom ? o.hopFrom*(o.hopT/0.16) : 0);
    ctx.save();
    ctx.translate(ox, o.y);
    if(o.shape==="rock"){
      ctx.fillStyle=t.tile[0];
      rr(-32,-26,64,52,14); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.22)"; rr(-32,8,64,18,10); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.25)"; rr(-24,-20,22,10,5); ctx.fill();
    } else if(o.shape==="cone"){
      ctx.fillStyle=t.tile[6];
      ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(26,24); ctx.lineTo(-26,24); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.moveTo(-13,2); ctx.lineTo(13,2); ctx.lineTo(17,12); ctx.lineTo(-17,12); ctx.closePath(); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.25)"; rr(-28,22,56,7,4); ctx.fill();
    } else if(o.shape==="barrel"){
      ctx.fillStyle=t.tile[3];
      ctx.beginPath(); ctx.arc(0,0,27,0,6.283); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.25)";
      rr(-27,-9,54,6,3); ctx.fill(); rr(-27,4,54,6,3); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.3)";
      ctx.beginPath(); ctx.arc(-9,-11,7,0,6.283); ctx.fill();
    } else if(o.shape==="crate"){
      ctx.fillStyle=t.tile[1];
      rr(-26,-26,52,52,7); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=4;
      ctx.strokeRect(-26,-26,52,52);
      ctx.beginPath(); ctx.moveTo(-26,-26); ctx.lineTo(26,26); ctx.moveTo(26,-26); ctx.lineTo(-26,26); ctx.stroke();
    } else { // shifty — the surprise block
      const preHop = !o.hopped && o.y > o.hopAt-80;
      const wob = Math.sin(this.timer*14+o.ph) * (preHop ? 0.28 : 0.1);
      ctx.rotate(wob);
      if(preHop && Math.floor(this.timer*12)%2===0) ctx.globalAlpha = 0.65;  // blink = about to hop!
      ctx.fillStyle=t.tile[4];
      rr(-28,-26,56,52,18); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2.5;
      rr(-28,-26,56,52,18); ctx.stroke();
      // mischievous eyes
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(-10,-6,7,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(10,-6,7,0,6.283); ctx.fill();
      ctx.fillStyle="#10131c";
      const look = o.hopped ? 0 : (o.lane===1 ? Math.sign(Math.sin(o.ph)) : (o.lane===0?1:-1))*3;
      ctx.beginPath(); ctx.arc(-10+look,-6,3.2,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(10+look,-6,3.2,0,6.283); ctx.fill();
      // grin + "?" badge
      ctx.strokeStyle="#10131c"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(0,6,9,0.25,2.9); ctx.stroke();
      ctx.globalAlpha=1;
      ctx.fillStyle="#ffcf5c"; ctx.font="bold 16px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("?", 0, -34);
    }
    ctx.restore();
  }
  draw(){
    const t=this.t;
    bgDark(t);
    // road
    ctx.fillStyle="rgba(255,255,255,.05)";
    rr(W/2-160, 0, 320, H, 0); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=3; ctx.setLineDash([26,34]);
    ctx.lineDashOffset = -this.roadOff;
    for(const lx of [W/2-52, W/2+52]){ ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke(); }
    ctx.setLineDash([]);
    // obstacles
    for(const o of this.obs) this.drawOb(o);
    // player — big cartoon runner
    ctx.save();
    ctx.translate(this.x, this.py);
    const lean = Math.max(-0.3, Math.min(0.3, (this.lanes[this.lane]-this.x)*0.015));
    ctx.rotate(lean);
    if(this.inv>0 && Math.floor(this.timer*10)%2===0) ctx.globalAlpha=.4;
    // ground shadow
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(0,24,18,6,0,0,6.283); ctx.fill();
    const bob = Math.sin(this.timer*13)*2;
    // running feet
    const step = Math.sin(this.timer*16);
    ctx.fillStyle="#10131c";
    rr(-12, 14+step*4, 10, 8, 4); ctx.fill();
    rr(2, 14-step*4, 10, 8, 4); ctx.fill();
    // body — bright with white outline for contrast
    ctx.fillStyle=t.tile[2];
    rr(-15,-20+bob,30,38,13); ctx.fill();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=2.5;
    rr(-15,-20+bob,30,38,13); ctx.stroke();
    // racing stripe
    ctx.fillStyle="rgba(255,255,255,.35)"; rr(-4,-18+bob,8,34,4); ctx.fill();
    // big eyes looking up the road
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(-6,-9+bob,5.5,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-9+bob,5.5,0,6.283); ctx.fill();
    ctx.fillStyle="#10131c";
    ctx.beginPath(); ctx.arc(-6,-11+bob,2.6,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-11+bob,2.6,0,6.283); ctx.fill();
    // cap
    ctx.fillStyle=t.tile[6];
    rr(-13,-24+bob,26,7,3.5); ctx.fill();
    rr(-2,-29+bob,12,6,3); ctx.fill();
    ctx.restore();
    // time bar
    const frac = Math.min(1, this.timer/this.P.time);
    ctx.fillStyle="rgba(0,0,0,.4)"; rr(40,20,W-80,14,7); ctx.fill();
    ctx.fillStyle="#5ee08a"; rr(40,20,(W-80)*frac,14,7); ctx.fill();
    if(this.timer < 2.5){
      ctx.fillStyle="rgba(0,0,0,.45)"; rr(46,H-64,W-92,34,9); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("◀ tap sides / swipe / arrows ▶", W/2, H-42);
    }
  }
}

/* =====================================================================
   ENGINE 4 — STACK TAP (tap to drop & align blocks)
   ===================================================================== */
class StackTap{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.BH=26;
    this.blocks=[{x:W/2, w:P.width}];   // base (center x, width)
    this.cur={x:60, w:P.width, dir:1};
    this.time=0; this.flash=0; this.slow=0; this.dropping=null;
    host.setProgress(`0 / ${P.height}`);
  }
  topY(i){ // screen y of block i (0=base at bottom)
    const camera = Math.max(0, (this.blocks.length-6))*this.BH;
    return H-60 - i*this.BH + camera;
  }
  oscOff(){ return this.P.moving ? Math.sin(this.time*2.1)*13 : 0; }
  drop(){
    if(this.dropping) return;
    const top = this.blocks[this.blocks.length-1];
    const topX = top.x + (this.blocks.length===1 ? 0 : this.oscOff()); // moving base drags tower
    const L1 = this.cur.x - this.cur.w/2, R1 = this.cur.x + this.cur.w/2;
    const L2 = topX - top.w/2, R2 = topX + top.w/2;
    const L = Math.max(L1,L2), R = Math.min(R1,R2);
    const overlap = R - L;
    if(overlap <= 5){ this.h.fail(); return; }
    let nx = (L+R)/2, nw = overlap;
    const y = this.topY(this.blocks.length);
    if(Math.abs(this.cur.x - topX) < 6){
      nx = topX; nw = top.w; this.flash = 0.4;             // perfect
      Sfx.play("perfect");
      FX.burst(nx, y-13, "#ffcf5c", 16, 200);
      FX.float(nx, y-40, "PERFECT!", "#ffcf5c");
    } else {
      Sfx.play("drop");
      FX.burst(L, y-13, "#ffffff", 4, 80); FX.burst(R, y-13, "#ffffff", 4, 80);
    }
    this.blocks.push({x:nx - (this.blocks.length===1?0:this.oscOff()), w:nw});
    this.h.setProgress(`${this.blocks.length-1} / ${this.P.height}`);
    if(this.blocks.length-1 >= this.P.height && !this.h.freeplay){ this.h.win(); return; }
    this.cur = {x: this.cur.dir>0 ? 40 : W-40, w:nw, dir:-this.cur.dir};
  }
  onDown(){ this.drop(); }
  onKey(k){ if(k===" "||k==="ArrowUp"||k==="w") this.drop(); }
  revive(){ this.slow = 2.0; }
  progress(){ return (this.blocks.length-1) / this.P.height; }
  update(dt){
    this.time += dt;
    if(this.flash>0) this.flash -= dt;
    let sp = this.P.speed;
    if(this.slow>0){ this.slow -= dt; sp *= 0.55; }
    this.cur.x += this.cur.dir * sp * dt;
    const m = this.cur.w/2 + 6;
    if(this.cur.x > W-m){ this.cur.x = W-m; this.cur.dir = -1; }
    if(this.cur.x < m){ this.cur.x = m; this.cur.dir = 1; }
  }
  draw(){
    const t=this.t;
    bgSky(t);
    ctx.fillStyle=t.ground; ctx.fillRect(0,H-34,W,34);
    const osc = this.oscOff();
    for(let i=0;i<this.blocks.length;i++){
      const b=this.blocks[i], y=this.topY(i);
      if(y>H+30 || y<-40) continue;
      const off = i===0 ? 0 : osc;
      const hue = this.t.tile[i % this.t.tile.length];
      ctx.fillStyle = hue;
      rr(b.x+off-b.w/2, y-this.BH+2, b.w, this.BH-3, 6); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.22)";
      rr(b.x+off-b.w/2+3, y-this.BH+4, b.w-6, 7, 4); ctx.fill();
    }
    // moving block at next row
    const y = this.topY(this.blocks.length);
    ctx.fillStyle = this.t.tile[this.blocks.length % this.t.tile.length];
    ctx.globalAlpha = .95;
    rr(this.cur.x-this.cur.w/2, y-this.BH+2, this.cur.w, this.BH-3, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.setLineDash([5,9]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(this.cur.x, y+4);
    ctx.lineTo(this.cur.x, this.topY(this.blocks.length-1)-this.BH);
    ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
    if(this.flash>0){
      ctx.fillStyle="#fff"; ctx.font="bold 20px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
      ctx.fillText("PERFECT!", W/2, 120);
    }
    ctx.fillStyle="rgba(0,0,0,.4)"; rr(60,20,W-120,32,9); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 14px 'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',sans-serif"; ctx.textAlign="center";
    ctx.fillText(`Stack ${this.P.height} blocks${this.P.moving?" — the tower sways!":""}`, W/2, 41);
  }
}

/* =====================================================================
   ENGINE 5 — MERGE ROLL (drag matching orbs to a target value)
   ===================================================================== */
class MergeRoll{
  constructor(host,P,theme){
    this.h=host; this.P=P; this.t=theme;
    this.N=4; this.cell=82; this.x0=(W-this.N*this.cell)/2; this.y0=140;
    this.g=[]; for(let r=0;r<this.N;r++){ this.g.push([]); for(let c=0;c<this.N;c++) this.g[r].push(0); }
    for(let i=0;i<6;i++) this.spawnOrb();
    this.movesLeft = P.moves;   // 0 = unlimited
    this.drag=null; this.best=2;
    this.updateHud();
  }
  updateHud(){
    const mv = this.movesLeft>0 ? ` · ${this.movesLeft} moves` : "";
    this.h.setProgress(`best ${this.best} / ${this.P.target}${mv}`);
  }
  empties(){ const e=[]; for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++) if(!this.g[r][c]) e.push({r,c}); return e; }
  spawnOrb(){
    const e=this.empties(); if(!e.length) return;
    const p=e[Math.floor(Math.random()*e.length)];
    const roll = Math.random();
    // higher difficulty seeds richer orbs so long targets stay pace-able
    this.g[p.r][p.c] = (this.P.d>0.5 && roll<0.12) ? 8 : roll<0.4 ? 4 : 2;
  }
  cellAt(p){
    const c=Math.floor((p.x-this.x0)/this.cell), r=Math.floor((p.y-this.y0)/this.cell);
    if(r<0||c<0||r>=this.N||c>=this.N) return null; return {r,c};
  }
  onDown(p){ const cc=this.cellAt(p); if(cc && this.g[cc.r][cc.c]) this.drag={from:cc, x:p.x, y:p.y}; }
  onMove(p){ if(this.drag){ this.drag.x=p.x; this.drag.y=p.y; } }
  onUp(p){
    if(!this.drag) return;
    const from=this.drag.from, to=this.cellAt(p); this.drag=null;
    if(!to || (to.r===from.r && to.c===from.c)) return;
    const a=this.g[from.r][from.c], b=this.g[to.r][to.c];
    let acted=false;
    if(b===a && a>0){
      this.g[to.r][to.c]=a*2; this.g[from.r][from.c]=0; this.best=Math.max(this.best,a*2); acted=true;
      const cx=this.x0+to.c*this.cell+this.cell/2, cy=this.y0+to.r*this.cell+this.cell/2;
      Sfx.play("merge");
      FX.burst(cx, cy, this.orbColor(a*2), 14, 170);
      FX.float(cx, cy-38, String(a*2), "#fff");
    }
    else if(b===0){ this.g[to.r][to.c]=a; this.g[from.r][from.c]=0; acted=true; Sfx.play("tap"); }
    if(!acted) return;
    if(this.movesLeft>0) this.movesLeft--;
    for(let i=0;i<this.P.spawnN;i++) this.spawnOrb();
    this.updateHud();
    if(this.best >= this.P.target && !this.h.freeplay){ this.h.win(); return; }
    if(this.movesLeft===0 && this.P.moves>0){ this.h.fail(); return; }
    // dead board?
    if(!this.empties().length){
      const vals={}; let pair=false;
      for(let r=0;r<this.N;r++)for(let c=0;c<this.N;c++){ const v=this.g[r][c]; if(vals[v]) pair=true; vals[v]=1; }
      if(!pair){ this.h.fail(); }
    }
  }
  revive(){
